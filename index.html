<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>整形外科 論文ダイジェスト</title>
  <meta name="description" content="整形外科各分野の最新エビデンスを横断的に参照できる医師向け論文データベース">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F0F4F8;--surface:#FFF;--border:#E2E8F0;--border-strong:#CBD5E1;
      --text-primary:#0F172A;--text-secondary:#475569;--text-muted:#94A3B8;
      --accent:#1D4ED8;--accent-bg:#EFF6FF;--accent-text:#1E40AF;
      --success:#059669;--success-bg:#ECFDF5;--success-text:#065F46;
      --danger:#DC2626;--danger-bg:#FEF2F2;--danger-text:#991B1B;
      --radius:10px;--radius-lg:14px;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#0F172A;--surface:#1E293B;--border:#334155;--border-strong:#475569;
        --text-primary:#F1F5F9;--text-secondary:#94A3B8;--text-muted:#64748B;
        --accent-bg:#1E3A8A;--accent-text:#93C5FD;
        --success-bg:#064E3B;--success-text:#6EE7B7;
        --danger-bg:#7F1D1D;--danger-text:#FCA5A5;
      }
    }
    body{
      font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
      background:var(--bg);color:var(--text-primary);font-size:14px;line-height:1.6;min-height:100vh;
    }
    .header{background:var(--surface);border-bottom:.5px solid var(--border);position:sticky;top:0;z-index:100}
    .header-inner{max-width:760px;margin:0 auto;padding:.875rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-icon{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
    .logo h1{font-size:15px;font-weight:700}
    .logo p{font-size:11px;color:var(--text-muted);margin-top:1px}
    .update-info{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted)}
    .tabs-wrap{background:var(--surface);border-bottom:.5px solid var(--border);position:sticky;top:62px;z-index:90}
    .tabs{max-width:760px;margin:0 auto;padding:.625rem 1rem;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tabs::-webkit-scrollbar{display:none}
    .tab{padding:5px 13px;border-radius:16px;font-size:12px;font-weight:500;border:.5px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit}
    .tab.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
    .main{max-width:760px;margin:0 auto;padding:0 1rem 5rem}
    .notice{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);margin:1rem 0 0;font-size:13px}
    .count-row{display:flex;align-items:center;justify-content:space-between;padding:.875rem 0 .625rem;font-size:12px;color:var(--text-muted)}
    .paper-list{display:flex;flex-direction:column;gap:8px}
    .card{background:var(--surface);border-radius:var(--radius-lg);border:.5px solid var(--border);overflow:hidden}
    .card-header{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
    .card-header:hover{background:rgba(0,0,0,.018)}
    @media(prefers-color-scheme:dark){.card-header:hover{background:rgba(255,255,255,.03)}}
    .card-meta{display:flex;align-items:center;justify-content:space-between}
    .badges{display:flex;gap:5px;flex-wrap:wrap}
    .badge{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:500}
    .card-title{font-size:13px;font-weight:500;line-height:1.55}
    .card-journal{font-size:11px;color:var(--text-muted)}
    .card-body{border-top:.5px solid var(--border);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
    .section-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px}
    .section-text{font-size:13px;line-height:1.65}
    .fab-wrap{position:fixed;bottom:1.5rem;right:1rem;z-index:90}
    @media(min-width:820px){.fab-wrap{right:calc(50vw - 380px + 1rem)}}
    .fab{display:flex;align-items:center;gap:7px;padding:13px 22px;background:var(--accent);color:#fff;border:none;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(29,78,216,.38)}
    .fab:hover{background:#1E40AF}
    .fab:disabled{opacity:.6;cursor:not-allowed}
    .empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{display:inline-block;animation:spin .8s linear infinite}
  </style>
</head>
<body>

<header class="header" role="banner">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon" aria-hidden="true"><i class="ti ti-stethoscope"></i></div>
      <div>
        <h1>整形外科 論文ダイジェスト</h1>
        <p>脊椎・肩・肘・手指・股関節・膝・外傷</p>
      </div>
    </div>
    <div class="update-info" id="updateInfo"></div>
  </div>
</header>

<div class="tabs-wrap" role="navigation" aria-label="分野フィルタ">
  <div class="tabs" id="tabs"></div>
</div>

<main class="main">
  <div class="notice" id="noticeBar" style="display:none" role="status" aria-live="polite">
    <i class="ti ti-loader spin" id="noticeIcon" aria-hidden="true"></i>
    <span id="noticeText"></span>
  </div>
  <div class="count-row">
    <span id="countLabel"></span>
    <span id="newLabel" style="color:#059669"></span>
  </div>
  <div class="paper-list" id="papers" role="list"></div>
</main>

<div class="fab-wrap">
  <button class="fab" id="fetchBtn" onclick="reloadNews()">
    <i class="ti ti-refresh" id="fetchIcon" aria-hidden="true"></i>最新ニュースを読込
  </button>
</div>

<script>
const SPECIALTIES = ["すべて","脊椎","肩","肘","手指","股関節","膝","外傷"];
const SP_STYLE = {
  "脊椎":{bg:"#F5F3FF",text:"#6D28D9"},
  "肩":{bg:"#EFF6FF",text:"#1E40AF"},
  "肘":{bg:"#ECFEFF",text:"#155E75"},
  "手指":{bg:"#ECFDF5",text:"#065F46"},
  "股関節":{bg:"#FFFBEB",text:"#92400E"},
  "膝":{bg:"#FEF2F2",text:"#991B1B"},
  "外傷":{bg:"#F8FAFC",text:"#475569"}
};

const BASE_PAPERS = [
  {id:"s1",specialty:"脊椎",title:"腰椎脊柱管狭窄症：除圧単独 vs 除圧＋固定 SSSS試験5年RCT",journal:"Bone & Joint, 2024",overview:"スウェーデン多施設RCT。変性すべりの有無にかかわらず247例を除圧+固定群 vs 除圧単独群に無作為化し5年追跡。",results:"固定追加による上乗せ効果なし。二次転帰3項目では除圧単独群が有意に優れた。2年MRIで固定群は再狭窄が有意に多かった。",conclusion:"変性すべり合併例でも固定の上乗せ効果がないことを示す一連のRCT（SLIP・Nordsten・SSSS）の中で、高侵襲・高コストな固定術の適応を厳格化すべきという国際的な議論が続いている。"},
  {id:"s2",specialty:"脊椎",title:"脊椎後方固定術への術野バンコマイシン粉末：6RCT 2140例でSSI予防効果なし（メタ解析）",journal:"JBJS Specialty Update / Spine誌, 2026年6・9月",overview:"6件のRCT・2140例を解析したメタ解析。STRIVE試験の後向き再解析も同時期に発表。術野バンコマイシン粉末（IVP）のSSI予防効果を再評価した。",results:"深部・浅部・総SSIのいずれにも有意差なし。別の単施設RCTでは深部SSI有意減少（0% vs 1.4%）も浅部SSIはIVP群で高い傾向（2% vs 0.9%）。",conclusion:"ルーチン投与の根拠が乏しいことが改めて示された。スイスVANCO試験の最終結果待ちであり、リスクベースの選択的使用へのシフトが議論されている。"},
  {id:"s3",specialty:"脊椎",title:"ロボット支援脊椎手術 vs CTナビゲーション：椎弓根スクリュー精度でロボットが有意に優れる（クラスIエビデンス）",journal:"EFORT Open Rev / Musculoskeletal Surg, 2026年1・7月",overview:"フリーハンド・ナビゲーション・ロボットをクラス別に評価した系統的レビュー・メタ解析＋アンブレラメタ解析。",results:"ロボットはフリーハンド比OR 2.74倍、ナビゲーション比OR 2.36倍の許容スクリュー設置率。研修中のレジデントでもロボット支援下では安全な設置が可能。",conclusion:"クラスIエビデンスでロボット支援の精度優位性が確立。コスト・学習曲線という課題は残るが、精度・安全性・教育的価値の観点からロボット脊椎手術の適応拡大が正当化されつつある。"},
  {id:"s4",specialty:"脊椎",title:"VBT（椎体テザリング）術後の肺合併症：60例中36.7%・気胸が最多（30.4%）",journal:"JBJS, 2026年6月",overview:"単施設でVBTを施行した60例（女性51例）の周術期肺合併症を後向き評価。手術範囲・部位・矯正量がリスク因子として検討された。",results:"36.7%に肺合併症が発生。最多は気胸（30.4%）。手術範囲・部位・矯正量が有意なリスク因子として同定。",conclusion:"VBTは前胸郭経由アプローチを要するため肺合併症が従来のAIS後方固定術と比較して格段に高頻度であることが判明。患者カウンセリングへのリスク明示と高ボリューム専門施設への集約化が不可欠。"},
  {id:"s5",specialty:"脊椎",title:"胸腰椎バースト骨折：術前CT Hounsfield値（HU値）が術後3ヶ月の椎体再虚脱を予測",journal:"Int J Spine Surg, 2026年9月",overview:"後方固定術施行の労働年齢患者を対象とした後向きコホート研究。術前CTのHU値と術後3ヶ月椎体再虚脱の関連を解析。",results:"低HU値が術後3ヶ月椎体再虚脱の独立した予測因子として同定された。",conclusion:"CTのHU値は骨粗鬆症スクリーニングの簡便な代替指標として術前評価に活用可能。低HU値患者では椎体形成術追加・セメント補強・前後合併固定の検討が必要。"},
  {id:"sh1",specialty:"肩",title:"FIMPACT試験10年：肩峰下除圧術（ASD）は偽手術・運動療法と比較して臨床的に有意差なし",journal:"BMJ, 2025年12月",overview:"フィンランド多施設三群RCT（ASD群・診断的関節鏡群・運動療法群）210例の10年追跡。",results:"10年時点でのASDの疼痛・機能は偽手術・運動療法と比較して有意差なし。2年・5年追跡でも同様の結論。",conclusion:"「世界で最も多く行われる肩手術の一つ」であるASDが孤立性インピンジメント症候群には有効でないという結論が最高レベルエビデンスで確定。腱板断裂合併例への同時ASDは別問題として引き続き検討が必要。"},
  {id:"sh2",specialty:"肩",title:"腱板断裂：保存療法 vs 腱板修復 15年RCT追跡で同等転帰（Moosmayer et al.）",journal:"JBJS What's New in Shoulder & Elbow, 2026年7月",overview:"小〜中等大全層腱板断裂103例対象RCTの15年追跡（81%フォローアップ継続）。保存療法群51例中15例が後に手術に移行。",results:"15年時点でConstant・ASES・SF-36・患者満足度は両群間で有意差なし。10年時点では手術優位だったが15年で収束した。",conclusion:"長期では保存療法でも同等転帰が得られうるというエビデンスが蓄積。断裂拡大リスクへの定期的画像フォローと個別化判断が引き続き重要。"},
  {id:"sh3",specialty:"肩",title:"Bankart修復＋Remplissage：単独と比べ再発率9分の1・前方挙上も有意増加",journal:"JBJS What's New in Shoulder & Elbow, 2026年7月",overview:"Engaging Hill-Sachs病変を有する前方肩関節不安定症に対するBankart＋Remplissage vs Bankart単独の比較メタ解析。",results:"再発率が9分の1に低下。前方挙上が有意に増加（平均差1.97°、p<0.001）。可動域への悪影響は従来の懸念より小さいことが確認された。",conclusion:"Hill-Sachs病変を伴う前方不安定症ではRemplissage追加が推奨される。可動域制限という懸念が払拭され、Latarjetより低侵襲なBankart＋Remplissageを第一選択とする流れが加速している。"},
  {id:"sh4",specialty:"肩",title:"aTSA/rTSA長期生存率：aTSA 15年91%・rTSA 10年94%（4国際レジストリ＋メタ解析）",journal:"SAGE誌, 2026年7月",overview:"4国際レジストリ＋7ケースシリーズを統合したaTSA/rTSA生存率メタ解析（≧13年追跡）。",results:"aTSA 13年生存率91.50%・15年生存率90.82%。rTSA（ノルウェーレジストリ5494例）10年生存率94%。男性・骨折後遺症が独立したrTSA再置換リスク因子。",conclusion:"両術式とも長期高生存率を達成するが、インプラントブランド・デザインが生存率を左右する。患者選択とインプラント選択の個別化が重要。"},
  {id:"sh5",specialty:"肩",title:"外傷性前方肩不安定症 ESSKA-ESA公式コンセンサス Part2：年齢・初回/再発別の治療・スポーツ復帰推奨",journal:"KSSTA, 2026年6月",overview:"欧州9カ国15人のステアリンググループによる構造化デルファイ法。23の臨床質問を評価、強い合意11件・相対的合意11件。",results:"20歳未満コンタクトアスリート（初回脱臼）：早期手術を強く推奨。20〜40歳初回：保存療法後に再発・高リスク例で手術。RTS基準として「時間でなく機能・心理的準備度」を強調。",conclusion:"前方不安定症の年齢×初回/再発×活動性に基づく意思決定アルゴリズムが初めて標準化。若年コンタクトアスリートへの早期手術推奨が保存療法優先の近年の潮流に対して重要な異論を提示している。"},
  {id:"sh6",specialty:"肩",title:"Latarjet術後コラコイド骨吸収（CRDL分類）：高度吸収（Grade 3）で疼痛増加・機能低下",journal:"Am J Sports Med, 2026年3月",overview:"関節鏡的Latarjet術後コラコイドグラフト吸収の臨床的影響を再評価。新CRDL分類システムを開発・検証し、グラフト吸収グレードとASES・VASスコアの相関を評価。",results:"CRDL Grade 3（高度吸収）でASESスコアが有意に低く、VASスコアが有意に高かった。安定性指標の大半には有意差なし。",conclusion:"「コラコイド吸収は臨床的に無意味」という従来の定説に疑問が投じられた。高齢・喫煙・大骨欠損がリスク因子。高リスク患者への術前カウンセリングと術後定期CTフォローの重要性が示された。"},
  {id:"sh7",specialty:"肩",title:"修復不能巨大腱板断裂：SCR vs rTSA 合併症率（SCR 3.5% vs rTSA 10.8%）で有意差",journal:"Clin Orthop Surg, 2026年6月",overview:"関節炎を伴わない修復不能腱板断裂に対するSCRとrTSAを比較した7件・430例のメタ解析（PRISMA 2020準拠）。",results:"機能・疼痛・可動域は両群で有意差なし。SCRの全合併症率が有意に低かった（3.5% vs 10.8%、OR 0.32、p=0.020）。",conclusion:"機能・疼痛は同等でありながらSCRの合併症率が低く、特に若年患者では関節温存的SCRが第一選択となりうる。年齢・活動性・骨質の個別化判断が重要。"},
  {id:"sh8",specialty:"肩",title:"rTSA revision後の再revision：NJR 685例で再revision率34%・術者中央値4例/10年",journal:"PMC, 2026年7月",overview:"英国NJR（26403例・平均追跡4.9年）からrTSA revision 685例を同定し、再revision率・原因・術者別件数を分析した研究。",results:"再revision率34%。revision手術を行った術者244名の中央値は4例/10年（IQR 2〜7例）と極めて低量。",conclusion:"rTSA revisionは高難度手術でありながら多くの術者が少数例しか経験しない実態が判明。高volume専門施設への集約化が再revision率低減に不可欠。"},
  {id:"el1",specialty:"肘",title:"SCIENCE試験：小児転位性肘内側上顆骨折への手術は機能的転帰を改善しない（The Lancet RCT）",journal:"The Lancet, 2026年1月",overview:"英国・豪州・NZ 59施設・334例（7〜15歳）の多施設RCT。ギプス固定群 vs 手術固定群を比較。主要転帰は12ヶ月PROMIS上肢スコア。",results:"12ヶ月PROMs（PROMIS上肢）に有意差なし。手術群で術中合併症14件・再手術7例・スクリュー/ワイヤー抜去17例。NHS費用は手術群が£2435多くQALYは逆に低い。費用対効果確率0%。",conclusion:"「手術で骨を固定すべき」という積極派の意見を否定する初の大規模RCT。ギプス固定がより安全・低コストな選択肢であり、診療ガイドライン改訂への影響が注目される。"},
  {id:"el2",specialty:"肘",title:"SOFIE RCT：高齢者（75歳以上）肘頭骨折 手術 vs 保存療法 12ヶ月DASHスコアに差なし",journal:"JBJS, 2025年",overview:"豪州・NZ 24施設の多施設RCT。75歳以上の急性転位閉鎖性肘頭骨折を手術群（TBW/プレート）vs 保存療法群（スリング＋早期運動）に割付。",results:"12ヶ月DASHスコアに手術群・保存療法群で有意差なし。",conclusion:"高齢者肘頭骨折では保存療法が手術と同等の12ヶ月機能転帰をもたらす合理的選択肢であることを示す高品質RCT。SCIENCE試験と同様に「骨折への手術適応を再考する」潮流を後押しする。"},
  {id:"el3",specialty:"肘",title:"Tommy John手術失敗後のInternal Brace Revision修復：投手11例全員が術前レベル以上に復帰・平均9ヶ月",journal:"OJSM, 2026年4月",overview:"UCL再建術失敗後にRevision UCL repair with Internal Brace（コラーゲンコーティングFiberTape）を施行したプロ・大学投手11例の後向き研究（平均追跡2.9年）。",results:"全11例が術前レベル以上への競技復帰を達成。競技復帰までの平均期間は9ヶ月。ASES肘スコア平均35.8/36と良好。",conclusion:"UCL再建術失敗後のRevision手術はもともと転帰不良とされてきたが、Internal Brace修復がこの常識を覆す可能性を示した。日本発shoelace＋Internal Brace技術でも骨片合併例を含む良好な成績が報告されている。"},
  {id:"el4",specialty:"肘",title:"遠位上腕二頭筋腱部分断裂（グレード<50%）：保存療法で6ヶ月83%が完全回復",journal:"JSES, 2026年1月",overview:"部分遠位上腕二頭筋腱断裂に対する保存療法の効果を評価したケースコントロール研究。3・6ヶ月で評価し、不十分な回復には手術（腱固定術）を提示。",results:"グレード<50%の部分断裂への保存療法で6ヶ月時点に83%が完全回復を達成。残り17%に腱固定術が施行された。",conclusion:"部分遠位上腕二頭筋腱断裂は断裂深度50%以上・保存療法6ヶ月無効例に手術適応を絞る合理的な基準が示された。"},
  {id:"ha1",specialty:"手指",title:"指尖部切断再接着：7278断指メタ解析で生存率中央値85%・2本静脈吻合が成功予測因子",journal:"Eur J Plast Surg, 2026年3月",overview:"25研究・7278断指を対象としたメタ解析。生存率・機能転帰（TAM・2点識別覚・DASH）の予後因子を評価した。",results:"生存率50〜100%（中央値85%）。鋭利損傷・短い虚血時間・2本静脈吻合が一貫して高い生存率と関連。TAM中央値67.5°、2点識別覚加重平均5.6mm。",conclusion:"「温虚血6時間・冷虚血12時間」という従来の制限は実証的根拠が薄く、筋肉量の少ない指では延長虚血例でも成功再接着が報告されている。2本静脈吻合による静脈うっ血防止が重要技術として再確認された。"},
  {id:"ha2",specialty:"手指",title:"舟状骨骨折：YOLOv8ベースAI診断が単一PA方向X線で高精度検出（mAP@0.75=0.98）",journal:"Electronics, 2026年6月",overview:"10年間の手関節X線データを用いてYOLOv8アルゴリズムで舟状骨を自動セグメンテーション・骨折検出するDLSFDフレームワークを開発・検証した研究。",results:"舟状骨の自動セグメンテーション・骨折検出において高精度を達成（mAP@0.75=0.98）。PA単一方向からの実用的診断精度が確認された。",conclusion:"救急外来での多方向撮影困難例での見逃しリスクを大幅低減できる可能性がある。BSS最新ガイドラインとの統合と多施設外部検証が次の課題。"},
  {id:"ha3",specialty:"手指",title:"ゾーン2屈筋腱修復後：能動的早期運動（CAM）が受動的早期運動（EPM）より全時点でTAM・握力・DASHで有意に優れる（RCT）",journal:"2026年",overview:"ゾーン2全層屈筋腱断裂40例をCAM群とEPM群に無作為割付し、術後6週・12週でTAM・握力・DASHスコアを比較したRCT。",results:"CAM群がEPM群より全評価時点でTAM・握力・DASHにおいて有意に優れた。12週でCAM群の80%が「優」（Strickland分類）。",conclusion:"CAMはEPMより有意に優れた早期機能回復をもたらすことが初めてRCTで確認された。現代的な多ストランド修復後はCAMを標準プロトコルとして採用することが支持される。"},

let currentSp = "すべて";
let expandedId = null;
let newsPapers = [];
let lastUpdated = "";

async function loadNews() {
  try {
    const r = await fetch("news.json?t=" + Date.now());
    if (!r.ok) return;
    const data = await r.json();
    if (data.papers && data.papers.length > 0) {
      newsPapers = data.papers;
      lastUpdated = data.updated || "";
      showNotice("success", lastUpdated + "のニュースを読み込みました（" + newsPapers.length + "件）", 3000);
    }
    updateInfo();
  } catch(e) {}
}

function updateInfo() {
  const el = document.getElementById("updateInfo");
  if (lastUpdated) {
    el.innerHTML = `<i class="ti ti-calendar" aria-hidden="true"></i>${lastUpdated}更新`;
  } else {
    el.innerHTML = `<span style="font-size:11px;color:var(--text-muted)">毎週月曜自動更新</span>`;
  }
}

function allPapers() {
  const all = [...newsPapers, ...BASE_PAPERS];
  const seen = new Set();
  return all.filter(p => { if (seen.has(p.id)) return false; seen.add(p.id); return true; });
}

function filtered() {
  const all = allPapers();
  return currentSp === "すべて" ? all : all.filter(p => p.specialty === currentSp);
}

function renderTabs() {
  const all = allPapers();
  document.getElementById("tabs").innerHTML = SPECIALTIES.map(s => {
    const cnt = s === "すべて" ? all.length : all.filter(p => p.specialty === s).length;
    const active = s === currentSp;
    return `<button class="tab${active?" active":""}" onclick="selectTab('${s}')">${s} <small style="opacity:.7">${cnt}</small></button>`;
  }).join("");
}

function renderPapers() {
  const list = filtered();
  document.getElementById("countLabel").textContent = list.length + "件";
  const nc = list.filter(p => p.isNew).length;
  const nl = document.getElementById("newLabel");
  nl.textContent = nc > 0 ? "うち新着 " + nc + "件" : "";

  if (list.length === 0) {
    document.getElementById("papers").innerHTML = '<div class="empty">この分野の論文はありません</div>';
    return;
  }
  document.getElementById("papers").innerHTML = list.map(p => {
    const sp = SP_STYLE[p.specialty] || {bg:"#F8FAFC",text:"#475569"};
    const exp = expandedId === p.id;
    return `<article class="card" role="listitem">
      <div class="card-header" onclick="toggle('${p.id}')" role="button" aria-expanded="${exp}" tabindex="0">
        <div class="card-meta">
          <div class="badges">
            <span class="badge" style="background:${sp.bg};color:${sp.text}">${p.specialty}</span>
            ${p.isNew?'<span class="badge" style="background:#ECFDF5;color:#065F46">新着</span>':""}
          </div>
          <i class="ti ${exp?"ti-chevron-up":"ti-chevron-down"}" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i>
        </div>
        <p class="card-title">${p.title}</p>
        <p class="card-journal">${p.journal}</p>
      </div>
      ${exp?`<div class="card-body">
        <div><p class="section-label">概要</p><p class="section-text">${p.overview}</p></div>
        <div><p class="section-label">結果</p><p class="section-text">${p.results}</p></div>
        <div><p class="section-label">結論・考察</p><p class="section-text">${p.conclusion}</p></div>
      </div>`:""}
    </article>`;
  }).join("");
}

function selectTab(sp) { currentSp = sp; expandedId = null; renderTabs(); renderPapers(); }
function toggle(id) { expandedId = expandedId === id ? null : id; renderPapers(); }

let noticeTimer = null;
function showNotice(type, msg, autoHide) {
  const bar = document.getElementById("noticeBar");
  const icon = document.getElementById("noticeIcon");
  const text = document.getElementById("noticeText");
  const styles = {
    loading: {bg:"#EFF6FF",color:"#1E40AF",icon:"ti-loader spin"},
    success: {bg:"#ECFDF5",color:"#065F46",icon:"ti-check"},
    error:   {bg:"#FEF2F2",color:"#991B1B",icon:"ti-alert-circle"}
  };
  const s = styles[type] || styles.loading;
  bar.style.cssText = `display:flex;background:${s.bg};color:${s.color};`;
  icon.className = `ti ${s.icon}`;
  text.textContent = msg;
  if (noticeTimer) clearTimeout(noticeTimer);
  if (autoHide) noticeTimer = setTimeout(() => { bar.style.display="none"; }, autoHide);
}

async function reloadNews() {
  const btn = document.getElementById("fetchBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader spin" aria-hidden="true"></i>読込中...';
  showNotice("loading", "最新ニュースを読み込み中...");
  await loadNews();
  renderTabs();
  renderPapers();
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-refresh" aria-hidden="true"></i>最新ニュースを読込';
}

updateInfo();
renderTabs();
renderPapers();
loadNews().then(() => { renderTabs(); renderPapers(); });
</script>
</body>
</html>
