<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>整形外科 情報ダイジェスト</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231D4ED8'/><line x1='10.7' y1='10.7' x2='21.3' y2='21.3' stroke='white' stroke-width='5.3' stroke-linecap='round'/><circle cx='7.3' cy='7.3' r='4.8' fill='white'/><circle cx='11' cy='3.7' r='3' fill='white'/><circle cx='3.7' cy='3.7' r='3' fill='white'/><circle cx='24.7' cy='24.7' r='4.8' fill='white'/><circle cx='28.3' cy='28.3' r='3' fill='white'/><circle cx='21' cy='28.3' r='3' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F0F4F8;--surface:#FFF;--border:#E2E8F0;--border-strong:#CBD5E1;
      --text-primary:#0F172A;--text-secondary:#475569;--text-muted:#94A3B8;
      --accent:#1D4ED8;--accent-bg:#EFF6FF;--accent-text:#1E40AF;
      --success-bg:#ECFDF5;--success-text:#065F46;
      --danger-bg:#FEF2F2;--danger-text:#991B1B;
      --detail-bg:#F8FAFF;
      --radius:10px;--radius-lg:14px;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#0F172A;--surface:#1E293B;--border:#334155;--border-strong:#475569;
        --text-primary:#F1F5F9;--text-secondary:#94A3B8;--text-muted:#64748B;
        --accent-bg:#1E3A8A;--accent-text:#93C5FD;
        --success-bg:#064E3B;--success-text:#6EE7B7;
        --danger-bg:#7F1D1D;--danger-text:#FCA5A5;
        --detail-bg:#1a2744;
      }
    }
    body{font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text-primary);font-size:14px;line-height:1.6;min-height:100vh}
    .header{background:var(--surface);border-bottom:.5px solid var(--border);position:sticky;top:0;z-index:100}
    .header-inner{max-width:760px;margin:0 auto;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .logo{display:flex;align-items:center;gap:9px}
    .logo-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .logo h1{font-size:14px;font-weight:700}
    .logo p{font-size:10px;color:var(--text-muted);margin-top:1px}
    .header-right{display:flex;align-items:center;gap:8px}
    .update-badge{font-size:11px;color:var(--text-muted)}
    .icon-btn{width:32px;height:32px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
    .mode-bar{background:var(--surface);border-bottom:.5px solid var(--border);position:sticky;top:62px;z-index:95}
    .mode-inner{max-width:760px;margin:0 auto;padding:.5rem 1rem;display:flex;gap:8px}
    .mode-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;border:.5px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;font-family:inherit}
    .mode-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
    .subtabs-wrap{background:var(--surface);border-bottom:.5px solid var(--border);position:sticky;top:110px;z-index:90}
    .subtabs{max-width:760px;margin:0 auto;padding:.5rem 1rem;display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .subtabs::-webkit-scrollbar{display:none}
    .stab{padding:4px 11px;border-radius:14px;font-size:12px;font-weight:500;border:.5px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
    .stab.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
    .main{max-width:760px;margin:0 auto;padding:0 1rem 6rem}
    .notice{display:none;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);margin:1rem 0 0;font-size:13px}
    .count-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0 .5rem;font-size:12px;color:var(--text-muted)}
    .paper-list{display:flex;flex-direction:column;gap:8px}
    .new-divider,.old-divider{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:11px;font-weight:500}
    .new-divider{color:var(--success-text)}.new-divider::after{content:'';flex:1;height:.5px;background:var(--success-text);opacity:.3}
    .old-divider{color:var(--text-muted)}.old-divider::after{content:'';flex:1;height:.5px;background:var(--border)}
    .card{background:var(--surface);border-radius:var(--radius-lg);border:.5px solid var(--border);overflow:hidden}
    .card-header{padding:13px 15px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
    .card-header:hover{background:rgba(0,0,0,.018)}
    @media(prefers-color-scheme:dark){.card-header:hover{background:rgba(255,255,255,.03)}}
    .card-meta{display:flex;align-items:center;justify-content:space-between}
    .badges{display:flex;gap:5px;flex-wrap:wrap}
    .badge{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
    .card-title{font-size:13px;font-weight:500;line-height:1.5}
    .card-journal{font-size:11px;color:var(--text-muted)}
    .card-body{border-top:.5px solid var(--border);padding:13px 15px;display:flex;flex-direction:column;gap:11px}
    .section-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px}
    .section-text{font-size:13px;line-height:1.65}
    .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
    .detail-btn,.fav-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
    .detail-btn{border:.5px solid var(--accent);background:var(--accent-bg);color:var(--accent-text)}
    .detail-btn:hover{background:var(--accent);color:#fff}
    .fav-btn{border:.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary)}
    .fav-btn.on{border-color:#fecdd3;background:#fff1f2;color:#e11d48}
    .detail-panel{margin-top:12px;border-radius:var(--radius);background:var(--surface);border:.5px solid var(--border-strong);overflow:hidden;display:none}
    .detail-panel-header{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:.5px solid var(--border);font-size:12px;font-weight:700;color:var(--accent-text);background:var(--accent-bg)}
    .detail-section{padding:10px 14px;border-bottom:.5px solid var(--border)}
    .detail-section:last-child{border-bottom:none}
    .detail-section-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px}
    .detail-section-text{font-size:12px;line-height:1.7;color:var(--text-primary)}
    .detail-loading{padding:20px;text-align:center;font-size:13px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:8px}
    .implant-list{display:flex;flex-direction:column;gap:10px}
    .implant-card{background:var(--surface);border-radius:var(--radius-lg);border:.5px solid var(--border);overflow:hidden}
    .implant-header{padding:12px 15px;display:flex;align-items:center;justify-content:space-between}
    .implant-name{font-size:14px;font-weight:700}
    .stars{font-size:16px;letter-spacing:1px}
    .implant-items{border-top:.5px solid var(--border)}
    .implant-item{padding:10px 15px;border-bottom:.5px solid var(--border);display:flex;flex-direction:column;gap:4px}
    .implant-item:last-child{border-bottom:none}
    .implant-item-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .cat-badge{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:500}
    .implant-item-title{font-size:13px;font-weight:500}
    .implant-item-summary{font-size:12px;color:var(--text-secondary);line-height:1.6}
    .no-news{padding:10px 15px;font-size:12px;color:var(--text-muted)}
    .fab-wrap{position:fixed;bottom:1.5rem;right:1rem;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    @media(min-width:820px){.fab-wrap{right:calc(50vw - 380px + 1rem)}}
    .fab{display:flex;align-items:center;gap:7px;padding:13px 20px;background:var(--accent);color:#fff;border:none;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(29,78,216,.38)}
    .fab:hover{background:#1E40AF}.fab:disabled{opacity:.6;cursor:not-allowed}
    .round-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:14px}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:1rem}
    .overlay.open{display:flex}
    .modal{background:var(--surface);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
    .modal h2{font-size:15px;font-weight:700;margin-bottom:1rem}
    .modal label{display:block;font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:4px}
    .modal input{width:100%;padding:9px 12px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:var(--bg);color:var(--text-primary);font-size:13px;font-family:monospace;outline:none}
    .modal input:focus{border-color:var(--accent)}
    .modal-note{font-size:11px;color:var(--text-muted);margin-top:.5rem;line-height:1.6}
    .modal-note a{color:var(--accent)}
    .modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
    .btn{padding:8px 14px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);font-size:13px;cursor:pointer;font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn-danger{color:#DC2626}
    .theme-label{font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:10px}
    .swatches{display:flex;gap:10px;flex-wrap:wrap}
    .swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center}
    .swatch.active{border-color:var(--text-primary)}
    .swatch-name{font-size:10px;color:var(--text-muted);text-align:center;margin-top:2px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{display:inline-block;animation:spin .8s linear infinite}
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
          <line x1="8" y1="8" x2="16" y2="16" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <circle cx="5.5" cy="5.5" r="3.6"/><circle cx="8.2" cy="2.8" r="2.3"/><circle cx="2.8" cy="2.8" r="2.3"/>
          <circle cx="18.5" cy="18.5" r="3.6"/><circle cx="21.2" cy="21.2" r="2.3"/><circle cx="15.8" cy="21.2" r="2.3"/>
        </svg>
      </div>
      <div>
        <h1>整形外科 情報ダイジェスト</h1>
        <p>論文エビデンス ＆ 国内インプラント動向 <span style="opacity:.5">v4.2</span></p>
      </div>
    </div>
    <div class="header-right">
      <span class="update-badge" id="updateBadge"></span>
      <button class="icon-btn" onclick="openSettings()" title="設定" aria-label="設定">
        <i class="ti ti-settings" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>

<div class="mode-bar">
  <div class="mode-inner">
    <button class="mode-btn active" id="btnPapers" onclick="setMode('papers')">
      <i class="ti ti-file-text" aria-hidden="true"></i>論文
    </button>
    <button class="mode-btn" id="btnImplants" onclick="setMode('implants')">
      <i class="ti ti-building-factory-2" aria-hidden="true"></i>インプラントニュース
    </button>
  </div>
</div>

<div class="subtabs-wrap" id="subtabsWrap">
  <div class="subtabs" id="subtabs"></div>
</div>

<main class="main">
  <div class="notice" id="noticeBar" role="status" aria-live="polite">
    <i class="ti ti-loader spin" id="noticeIcon" aria-hidden="true"></i>
    <span id="noticeText"></span>
  </div>
  <div class="count-row">
    <span id="countLabel"></span>
    <span id="subLabel"></span>
  </div>
  <div id="content"></div>
</main>

<div class="fab-wrap">
  <button class="round-btn" onclick="openTheme()" title="テーマ変更" aria-label="テーマ変更">
    <i class="ti ti-palette" aria-hidden="true"></i>
  </button>
  <button class="fab" id="fetchBtn" onclick="reloadAll()">
    <i class="ti ti-refresh" aria-hidden="true"></i>最新情報を読込
  </button>
</div>

<!-- 設定モーダル -->
<div class="overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>設定</h2>
    <label for="geminiKeyInput">Gemini APIキー（手動取得用・任意）</label>
    <input type="password" id="geminiKeyInput" placeholder="AIza...">
    <p class="modal-note">
      設定すると「最新情報を読込」で新しい論文をリアルタイム取得できます。<br>
      <a href="https://aistudio.google.com" target="_blank" rel="noopener">aistudio.google.com</a>から無料で取得できます。
    </p>
    <div id="keyStatus" style="font-size:12px;color:var(--success-text);margin-top:.5rem;min-height:16px"></div>
    <div class="modal-row">
      <button class="btn btn-danger" onclick="clearKey()">削除</button>
      <button class="btn" onclick="testApi()">接続テスト</button>
      <button class="btn" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveKey()">保存</button>
    </div>
    <div id="testResult" style="font-size:12px;margin-top:.75rem;padding:8px;border-radius:6px;display:none"></div>
  </div>
</div>

<!-- テーマモーダル -->
<div class="overlay" id="themeOverlay" onclick="if(event.target===this)closeTheme()">
  <div class="modal">
    <h2>カラーテーマ</h2>
    <div class="swatches" id="swatches"></div>
    <div class="modal-row">
      <button class="btn btn-primary" onclick="closeTheme()">閉じる</button>
    </div>
  </div>
</div>

<script>
/* ──── 定数 ──── */
const SPECIALTIES = ["すべて","お気に入り","脊椎","肩","肘","手指","股関節","膝","外傷"];
const SP_STYLE = {
  "脊椎":{bg:"#F5F3FF",text:"#6D28D9"},"肩":{bg:"#EFF6FF",text:"#1E40AF"},
  "肘":{bg:"#ECFEFF",text:"#155E75"},"手指":{bg:"#ECFDF5",text:"#065F46"},
  "股関節":{bg:"#FFFBEB",text:"#92400E"},"膝":{bg:"#FEF2F2",text:"#991B1B"},
  "外傷":{bg:"#F8FAFC",text:"#475569"}
};
const SP_ICONS = {
  "脊椎":`<svg width="11" height="14" viewBox="0 0 11 14" fill="currentColor"><rect x=".5" y="0" width="10" height="3" rx="1"/><rect x=".5" y="4" width="10" height="3" rx="1"/><rect x=".5" y="8" width="10" height="3" rx="1"/><rect x=".5" y="11" width="10" height="3" rx="1"/></svg>`,
  "肩":`<svg width="14" height="12" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 10 C4 3 12 2 13 7"/><circle cx="13" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="2.5" cy="9.5" r="1.5" fill="currentColor" stroke="none"/></svg>`,
  "肘":`<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="2" y1="1" x2="7" y2="8"/><line x1="7" y1="8" x2="12" y2="8"/><circle cx="7" cy="8" r="2.2" fill="currentColor" stroke="none"/></svg>`,
  "手指":`<svg width="13" height="14" viewBox="0 0 13 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2.5" y1="13" x2="2.5" y2="7"/><line x1="5.5" y1="13" x2="5.5" y2="4"/><line x1="8.5" y1="13" x2="8.5" y2="5"/><line x1="11" y1="13" x2="11" y2="7.5"/><line x1="1" y1="13" x2="12" y2="13"/></svg>`,
  "股関節":`<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="5" r="3.2"/><circle cx="6" cy="5" r="1.3" fill="currentColor" stroke="none"/><path d="M8 8 Q10 10 11 13"/><path d="M4 8 Q2 10 1 13"/></svg>`,
  "膝":`<svg width="11" height="15" viewBox="0 0 11 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5.5" y1="0" x2="5.5" y2="5"/><ellipse cx="5.5" cy="8" rx="4" ry="3"/><circle cx="5.5" cy="8" r="1.5" fill="currentColor" stroke="none"/><line x1="5.5" y1="11" x2="5.5" y2="15"/></svg>`,
  "外傷":`<svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><rect x="5" y="1" width="3" height="11" rx="1.5"/><rect x="1" y="5" width="11" height="3" rx="1.5"/></svg>`
};
const RATING_COLORS = [
  {text:"#94A3B8"},{text:"#A16207"},{text:"#92400E"},{text:"#991B1B"}
];
const CAT_STYLE = {
  "新製品":{bg:"#EFF6FF",text:"#1E40AF"},"薬事承認":{bg:"#F0FDF4",text:"#166534"},
  "臨床データ":{bg:"#F5F3FF",text:"#6D28D9"},"提携・契約":{bg:"#FFFBEB",text:"#92400E"},
  "人事":{bg:"#F8FAFC",text:"#475569"},"その他":{bg:"#F8FAFC",text:"#64748B"}
};
const THEMES = [
  {id:"blue",  name:"クール",    color:"#1D4ED8",accent:"#1D4ED8",accentBg:"#EFF6FF",accentText:"#1E40AF",bg:"#F0F4F8",surface:"#FFF",textPrimary:"#0F172A",textSecondary:"#475569",border:"#E2E8F0"},
  {id:"green", name:"フォレスト",color:"#059669",accent:"#059669",accentBg:"#ECFDF5",accentText:"#065F46",bg:"#F0FAF6",surface:"#FFF",textPrimary:"#0F172A",textSecondary:"#475569",border:"#D1FAE5"},
  {id:"purple",name:"ラベンダー",color:"#7C3AED",accent:"#7C3AED",accentBg:"#F5F3FF",accentText:"#5B21B6",bg:"#F7F5FF",surface:"#FFF",textPrimary:"#0F172A",textSecondary:"#475569",border:"#E9D5FF"},
  {id:"amber", name:"サンセット",color:"#D97706",accent:"#D97706",accentBg:"#FFFBEB",accentText:"#92400E",bg:"#FDF8F0",surface:"#FFF",textPrimary:"#0F172A",textSecondary:"#475569",border:"#FDE68A"},
  {id:"dark",  name:"ナイト",   color:"#1E293B",accent:"#3B82F6",accentBg:"#1E3A8A",accentText:"#93C5FD",bg:"#0F172A",surface:"#1E293B",textPrimary:"#F1F5F9",textSecondary:"#94A3B8",border:"#334155"}
];

/* ──── 論文データ ──── */

function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  currentThemeId = t.id;
  const r = document.documentElement;
  r.style.setProperty("--accent",t.accent); r.style.setProperty("--accent-bg",t.accentBg);
  r.style.setProperty("--accent-text",t.accentText); r.style.setProperty("--bg",t.bg);
  r.style.setProperty("--surface",t.surface); r.style.setProperty("--text-primary",t.textPrimary);
  r.style.setProperty("--text-secondary",t.textSecondary); r.style.setProperty("--border",t.border);
  localStorage.setItem("ortho_theme", id);
  renderSwatches();
}

  document.getElementById("swatches").innerHTML = THEMES.map(t=>`

/* ──── 詳細解析をAPIで生成 ──── */
async function fetchDetailFromApi(paper){
  const key = localStorage.getItem("ortho_gemini_key");
  if(!key) return null;
  const model = localStorage.getItem("ortho_gemini_model") || "gemini-flash-latest";
  const prompt = `整形外科医向けに以下の論文の詳細解説をJSON形式のみで返してください。論文: ${paper.title} (${paper.journal||""}) フィールド: background, methodology, keyFindings, clinicalImpact, limitations, relatedEvidence（各2〜3文）。JSONのみ。`;
  try{
    const r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}]})}
    );
    if(!r.ok) return null;
    const data = await r.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text||"";
    const m = text.match(/\{[\s\S]*\}/);
    return m ? JSON.parse(m[0]) : null;
  }catch(e){ return null; }
}

/* ──── Gemini手動取得 ──── */
async function fetchManual(){
  const key = localStorage.getItem("ortho_gemini_key");
  if(!key) return null;

  const today = new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});
  const prompt = `整形外科の最新論文4件をJSON配列で返してください。各フィールド: specialty(脊椎/肩/股関節/膝/外傷/肘/手指のいずれか), title(日本語), journal(雑誌名と年月), overview(1〜2文), results(1〜2文), conclusion(1〜2文)。JSONのみ。前置き不要。`;

  const body = JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}]});

  // 保存済みモデルを使う、なければ一覧から取得
  let model = localStorage.getItem("ortho_gemini_model") || "";
  if(!model){
    for(const ver of ["v1beta","v1"]){
      try{
        const r = await fetch(`https://generativelanguage.googleapis.com/${ver}/models?key=${key}`);
        if(r.ok){
          const d = await r.json();
          const all = (d.models||[]).map(m=>m.name.replace("models/",""));
          const flash = all.filter(n=>n.includes("flash"));
          model = flash[0] || all[0] || "";
          if(model){ localStorage.setItem("ortho_gemini_model", model); break; }
        }
      }catch(e){}
    }
  }
  if(!model) throw new Error("利用可能なモデルが見つかりませんでした。⚙設定の「接続テスト」を実行してください。");

  let r;
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 30000); // 30秒タイムアウト
    r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
      {method:"POST", headers:{"Content-Type":"application/json"}, body, signal:ctrl.signal}
    );
    clearTimeout(timer);
  }catch(e){
    if(e.name==="AbortError") throw new Error("タイムアウト（30秒）。再試行してください。");
    throw new Error("ネットワークエラー: "+e.message);
  }

  if(!r.ok){
    let msg = "エラー "+r.status;
    try{ const e=await r.json(); msg=e.error?.message||msg; }catch(ex){}
    // 混雑・過負荷・モデル未対応 → 全モデルを順番に試す
    if(r.status===503 || r.status===429 || r.status===404 || msg.includes("high demand") || msg.includes("overloaded") || msg.includes("invalid argument")){
      localStorage.removeItem("ortho_gemini_model");
      // 利用可能なモデル一覧を取得して全部試す
      let allModels = [];
      try{
        const lr=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        if(lr.ok){ const ld=await lr.json(); allModels=(ld.models||[]).map(m=>m.name.replace("models/","")); }
      }catch(ex){}
      if(!allModels.length) allModels=["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-2.5-pro","gemini-pro-latest","gemini-flash-lite-latest"];
      for(const fb of allModels){
        if(fb===model) continue; // 既に失敗したモデルはスキップ
        if(fb.includes("tts")||fb.includes("embed")) continue; // 音声・埋め込み系はスキップ
        try{
          const ctrl2=new AbortController();
          const t2=setTimeout(()=>ctrl2.abort(),30000);
          const r2=await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${fb}:generateContent?key=${key}`,
            {method:"POST",headers:{"Content-Type":"application/json"},body,signal:ctrl2.signal}
          );
          clearTimeout(t2);
          if(r2.ok){
            localStorage.setItem("ortho_gemini_model",fb);
            const data2=await r2.json();
            const text2=data2.candidates?.[0]?.content?.parts?.[0]?.text||"";
            const m2=text2.match(/\[[\s\S]*\]/);
            if(m2){
              const ts=Date.now();
              return JSON.parse(m2[0]).map((p,i)=>({...p,id:`manual_${ts}_${i}`,isNew:true}));
            }
          }
        }catch(ex){}
      }
      throw new Error("すべてのモデルが混雑中です。数分後に再試行してください。");
    }
    if(r.status===403) throw new Error("アクセス拒否（403）。APIキーまたはGenerative Language APIの有効化を確認してください。");
    throw new Error(msg);
  }
}

/* ──── インプラントニュース手動取得 ──── */
async function fetchManualImplants(){
  const key = localStorage.getItem("ortho_gemini_key");
  if(!key) return null;
  const model = localStorage.getItem("ortho_gemini_model") || "gemini-flash-latest";
  const today = new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});
  const COMPANIES = ["Stryker","Zimmer Biomet","DePuy Synthes（J&J）","Smith+Nephew","帝人ナカシマメディカル","メディカルネクスト","HOYAテクノサージカル","Globus Medical","京セラメディカル","日本MDM","Medtronic"];
  const prompt = `日本の整形外科インプラント11社の今週(${today})の動向をJSON配列で返してください。対象: ${COMPANIES.join(", ")}。各企業: company(企業名), rating(0〜3), items(配列: category(新製品/薬事承認/臨床データ/提携・契約/人事/その他), title(20字以内), summary(2〜3文))。情報なければrating:0, items:[]。JSONのみ。`;

  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 30000);
  try{
    const r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}]}),signal:ctrl.signal}
    );
    clearTimeout(t);
    if(!r.ok){
      let errMsg = "HTTP "+r.status;
      try{ const e=await r.json(); errMsg=e.error?.message||errMsg; }catch(ex){}
      if(r.status===503||r.status===429) throw new Error("混雑中のため取得できません。しばらく待ってから再試行してください。");
      if(r.status===404){ localStorage.removeItem("ortho_gemini_model"); throw new Error("モデルが見つかりません（404）。設定→接続テストを再実行してください。"); }
      throw new Error(errMsg);
    }
    const data = await r.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text||"";
    if(!text) throw new Error("APIからの応答が空でした");
    const m = text.match(/\[[\s\S]*\]/);
    if(!m) throw new Error("JSON解析失敗。応答: "+text.slice(0,100));
    return {
      updated: today,
      updated_iso: new Date().toISOString(),
      companies: JSON.parse(m[0])
    };
  }catch(e){
    clearTimeout(t);
    if(e.name==="AbortError") throw new Error("タイムアウト。再試行してください。");
    throw e;
  }
}

/* ──── 論文リスト ──── */
function allPapers(){
  const all = [...manualPapers, ...newsPapers, ...BASE_PAPERS];
  const seen = new Set();
  return all.filter(p=>{ if(seen.has(p.id)) return false; seen.add(p.id); return true; });
}
function filteredPapers(){
  const all = allPapers();
  let f;
  if(currentSp==="すべて")         f = all;
  else if(currentSp==="お気に入り") f = all.filter(p=>favorites.has(p.id));
  else                              f = all.filter(p=>p.specialty===currentSp);
  return [...f.filter(p=>p.isNew), ...f.filter(p=>!p.isNew)];
}

async function toggleDetail(id){
  const panel = document.getElementById("dp-"+id);
  const btn   = document.getElementById("db-"+id);
  if(!panel) return;

  // 閉じる
  if(detailShown.has(id)){
    panel.style.display="none"; detailShown.delete(id);
    if(btn) btn.innerHTML='<i class="ti ti-microscope"></i>詳しく読む';
    return;
  }

  // キャッシュ確認（files + localStorage）
  let d = detailsData[id] || localDetails[id];

  if(!d){
    const key = localStorage.getItem("ortho_gemini_key");
    if(key){
      // APIで生成
      panel.innerHTML='<div class="detail-loading"><i class="ti ti-loader spin"></i>詳細解析を生成中...</div>';
      panel.style.display="block";
      if(btn) btn.disabled=true;
      const paper = [...manualPapers,...newsPapers,...BASE_PAPERS].find(p=>p.id===id);
      if(paper) d = await fetchDetailFromApi(paper);
      if(d){ localDetails[id]=d; detailsData[id]=d; saveLocalDetails(); }
      if(btn) btn.disabled=false;
    }
  }

  if(d){
    renderDetailPanel(panel, d);
    panel.style.display="block";
    detailShown.add(id);
    if(btn) btn.innerHTML='<i class="ti ti-chevron-up"></i>詳細を閉じる';
  } else {
    const key = localStorage.getItem("ortho_gemini_key");
    const msg = key
      ? '<i class="ti ti-alert-circle"></i>生成に失敗しました。再度お試しください。'
      : '<i class="ti ti-settings"></i>⚙ 設定からGemini APIキーを登録すると詳細を表示できます';
    panel.innerHTML=`<div class="detail-loading">${msg}</div>`;
    panel.style.display="block";
  }
}

      ? `<i class="ti ti-heart-filled" style="font-size:11px"></i>`
      : (SP_ICONS[s]||"");
    return `<button class="stab${active?" active":""}" onclick="selectSp('${s}')" style="${style}">${icon}${s} <small style="opacity:.7">${cnt}</small></button>`;
  }).join("");
}
function renderPapers(){
  const list = filteredPapers();
  const nc = list.filter(p=>p.isNew).length;
  document.getElementById("countLabel").textContent = list.length+"件";
  const sl = document.getElementById("subLabel");
  sl.textContent = nc>0 ? "うち新着 "+nc+"件" : "";
  sl.style.color = "#059669";
  if(!list.length){ document.getElementById("content").innerHTML='<div class="empty">この分野の論文はありません</div>'; return; }
  let html = '<div class="paper-list">';
  let shownNew=false, shownOld=false;
  list.forEach(p=>{
    const sp = SP_STYLE[p.specialty]||{bg:"#F8FAFC",text:"#475569"};
    const exp = expandedId===p.id;
    const on = favorites.has(p.id);
    const dShown = detailShown.has(p.id);
    if(p.isNew && !shownNew){ html+=`<div class="new-divider"><i class="ti ti-sparkles"></i>今週の新着</div>`; shownNew=true; }
    if(!p.isNew && !shownOld && nc>0){ html+=`<div class="old-divider">アーカイブ</div>`; shownOld=true; }
    html += `<article class="card">
      <div class="card-header" onclick="togglePaper('${p.id}')">
        <div class="card-meta">
          <div class="badges">
            <span class="badge" style="background:${sp.bg};color:${sp.text}">${SP_ICONS[p.specialty]||""}${p.specialty}</span>
            ${p.isNew?'<span class="badge" style="background:#ECFDF5;color:#065F46">新着</span>':""}
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button id="fav-h-${p.id}" onclick="toggleFav('${p.id}',event)"
              style="background:none;border:none;cursor:pointer;padding:2px;font-size:18px;color:${on?"#e11d48":"var(--text-muted)"}" aria-label="お気に入り">
              <i class="ti ${on?"ti-heart-filled":"ti-heart"}"></i>
            </button>
            <i class="ti ${exp?"ti-chevron-up":"ti-chevron-down"}" style="font-size:15px;color:var(--text-muted)"></i>
          </div>
        </div>
        <p class="card-title">${p.title}</p>
        <p class="card-journal">${p.journal}</p>
      </div>
      ${exp ? `<div class="card-body">
        <div><div class="section-label">概要</div><div class="section-text">${p.overview}</div></div>
        <div><div class="section-label">結果</div><div class="section-text">${p.results}</div></div>
        <div><div class="section-label">結論・考察</div><div class="section-text">${p.conclusion}</div></div>
        <div class="card-actions">
          <button class="detail-btn" id="db-${p.id}" onclick="toggleDetail('${p.id}')">
            <i class="ti ${dShown?"ti-chevron-up":"ti-microscope"}"></i>${dShown?"詳細を閉じる":"詳しく読む"}
          </button>
          <button class="fav-btn${on?" on":""}" id="fav-b-${p.id}" onclick="toggleFav('${p.id}',event)">
            <i class="ti ${on?"ti-heart-filled":"ti-heart"}"></i>${on?"お気に入り解除":"お気に入りに追加"}
          </button>
        </div>
        <div id="dp-${p.id}" class="detail-panel" style="${dShown?"":"display:none"}"></div>
      </div>` : ""}
    </article>`;
  });
  html += '</div>';
  document.getElementById("content").innerHTML = html;
  // 開いているカードの詳細を復元
  detailShown.forEach(id=>{
    const panel = document.getElementById("dp-"+id);
    const btn = document.getElementById("db-"+id);
    if(!panel) return;
    const d = detailsData[id];
    if(d){
      panel.innerHTML = '<div class="detail-panel-header"><i class="ti ti-microscope"></i>詳細解析</div>' +
        [["background","研究背景・臨床的課題"],["methodology","研究デザイン・方法の詳細"],
         ["keyFindings","主要な発見・数値の詳細"],["clinicalImpact","日本の臨床現場へのインパクト"],
         ["limitations","研究の限界・課題"],["relatedEvidence","関連エビデンスとの比較"]
        ].filter(s=>d[s[0]]).map(s=>`<div class="detail-section"><div class="detail-section-label">${s[1]}</div><div class="detail-section-text">${d[s[0]]}</div></div>`).join("");
      panel.style.display="";
      if(btn) btn.innerHTML='<i class="ti ti-chevron-up"></i>詳細を閉じる';
    }
  });
}
function renderImplants(){
  document.getElementById("countLabel").textContent="";
  document.getElementById("subLabel").textContent="";
  if(!implantData){
    document.getElementById("content").innerHTML=`<div class="empty">
      <i class="ti ti-alert-circle" style="font-size:36px;display:block;margin-bottom:12px"></i>
      インプラントニュースを読み込めませんでした<br>
      <small>implant_news.json がリポジトリに存在するか確認してください</small><br><br>
      <button onclick="retryImplants()" class="btn">再試行</button></div>`;
    return;
  }
  const companies = implantData.companies||[];
  const active = companies.filter(c=>c.rating>0).length;
  document.getElementById("countLabel").textContent = companies.length+"社";
  const sl = document.getElementById("subLabel");
  sl.textContent = active+"社に動きあり";
  sl.style.color = active>0 ? "#92400E" : "var(--text-muted)";
  const sorted = [...companies].sort((a,b)=>(b.rating||0)-(a.rating||0));
  document.getElementById("content").innerHTML = '<div class="implant-list">'+sorted.map(c=>{
    const r = c.rating||0;
    const rc = RATING_COLORS[r]||RATING_COLORS[0];
    const stars = "★".repeat(r)+"☆".repeat(3-r);
    const items = c.items||[];
    return `<div class="implant-card">
      <div class="implant-header"><span class="implant-name">${c.company}</span><span class="stars" style="color:${rc.text}">${stars}</span></div>
      ${items.length?`<div class="implant-items">${items.map(item=>{
        const cs=CAT_STYLE[item.category]||CAT_STYLE["その他"];
        return `<div class="implant-item"><div class="implant-item-head"><span class="cat-badge" style="background:${cs.bg};color:${cs.text}">${item.category}</span><span class="implant-item-title">${item.title}</span></div><p class="implant-item-summary">${item.summary}</p></div>`;
      }).join("")}</div>`:`<p class="no-news">今週は特筆すべき動きなし</p>`}
    </div>`;
  }).join("")+'</div>';
}
async function retryImplants(){
  showNotice("loading","再読み込み中...");
  await loadImplants();
  document.getElementById("noticeBar").style.display="none";
  renderImplants();
}
function render(){
  updateBadge();
  if(currentMode==="papers"){
    document.getElementById("subtabsWrap").style.display="";
    renderSubtabs(); renderPapers();
  } else {
    document.getElementById("subtabsWrap").style.display="none";
    renderImplants();
  }
}
async function setMode(mode){
  currentMode = mode; expandedId = null;
  document.getElementById("btnPapers").classList.toggle("active", mode==="papers");
  document.getElementById("btnImplants").classList.toggle("active", mode==="implants");
  if(mode==="implants" && !implantData){
    showNotice("loading","インプラントニュースを読み込み中...");
    await loadImplants();
    document.getElementById("noticeBar").style.display="none";
  }
  render();
}
function selectSp(sp){ currentSp=sp; expandedId=null; renderSubtabs(); renderPapers(); }
function togglePaper(id){ expandedId = expandedId===id ? null : id; renderPapers(); }

/* ──── 通知 ──── */
let noticeTimer = null;
function showNotice(type, msg, autoHide){
  const bar=document.getElementById("noticeBar");
  const s={loading:{bg:"#EFF6FF",color:"#1E40AF",icon:"ti-loader spin"},success:{bg:"#ECFDF5",color:"#065F46",icon:"ti-check"},error:{bg:"#FEF2F2",color:"#991B1B",icon:"ti-alert-circle"}}[type];
  bar.style.cssText=`display:flex;background:${s.bg};color:${s.color};`;
  document.getElementById("noticeIcon").className="ti "+s.icon;
  document.getElementById("noticeText").textContent=msg;
  if(noticeTimer) clearTimeout(noticeTimer);
  if(autoHide) noticeTimer=setTimeout(()=>{ bar.style.display="none"; }, autoHide);
}

/* ──── 最新情報を読込 ──── */
async function testApi(){
  const key = document.getElementById("geminiKeyInput").value.trim()
              || localStorage.getItem("ortho_gemini_key") || "";
  const res = document.getElementById("testResult");
  res.style.display="block"; res.style.background="var(--accent-bg)";
  res.textContent="接続テスト中...";
  if(!key){ res.textContent="❌ APIキーが未入力です"; res.style.background="var(--danger-bg)"; return; }

  const MODELS = ["gemini-flash-latest","gemini-flash-lite-latest","gemini-3.6-flash","gemini-2.5-flash-lite"];
  const results = [];
  for(const model of MODELS){
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 10000);
      const r = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
        {method:"POST", headers:{"Content-Type":"application/json"},
         body:JSON.stringify({contents:[{role:"user",parts:[{text:"hello"}]}]}),
         signal:ctrl.signal}
      );
      clearTimeout(t);
      results.push(`${model}: ${r.status}`);
      if(r.ok){
        localStorage.setItem("ortho_gemini_model", model);
        res.style.background="var(--success-bg)";
        res.textContent="✅ 成功！ 使用モデル: "+model;
        return;
      }
    }catch(e){ results.push(`${model}: ${e.name==="AbortError"?"タイムアウト":"エラー"}`); }
  }
  res.style.background="var(--danger-bg)";
  res.innerHTML="結果:<br>"+results.join("<br>");
}

async function reloadAll(){
  const btn = document.getElementById("fetchBtn");
  btn.disabled = true;
  const hasKey = !!localStorage.getItem("ortho_gemini_key");

  if(currentMode === "implants"){
    // インプラントニュースモード
    btn.innerHTML=`<i class="ti ti-loader spin"></i>${hasKey?"インプラント情報を取得中...":"読込中..."}`;
    if(hasKey){
      showNotice("loading","Gemini API でインプラントニュースを取得中...");
      try{
        const data = await fetchManualImplants();
        if(data && data.companies){
          implantData = data; implantsUpdated = data.updated;
          render();
          showNotice("success","インプラントニュースを更新しました（"+data.companies.length+"社）", 3000);
        } else {
          showNotice("error","データの取得に失敗しました", 4000);
        }
      }catch(e){
        showNotice("error","取得に失敗しました："+e.message, 6000);
      }
    } else {
      showNotice("loading","最新情報を取得中...");
      await loadImplants();
      showNotice("success","読み込みました", 3000);
    }
    render();
  } else {
    // 論文モード
    btn.innerHTML=`<i class="ti ti-loader spin"></i>${hasKey?"論文を取得中...":"読込中..."}`;
    if(hasKey){
      showNotice("loading","Gemini API で新しい論文を取得中...");
      try{
        const papers = await fetchManual();
        if(papers && papers.length){
          manualPapers = [...papers, ...manualPapers];
          saveManualPapers();
          showNotice("loading","詳細解析を生成中...");
          for(const p of papers){
            try{ const detail = await fetchDetailFromApi(p); if(detail){ localDetails[p.id]=detail; } }catch(ex){}
          }
          saveLocalDetails();
          showNotice("success", papers.length+"件の新着論文を取得しました（詳細解析含む）", 3000);
        }
      }catch(e){
        showNotice("error","取得に失敗しました："+e.message, 4000);
      }
    } else {
      showNotice("loading","最新情報を取得中...");
    }
    await loadAll();
    render();
    if(!hasKey) showNotice("success","最新情報を読み込みました", 3000);
  }

  btn.disabled=false;
  btn.innerHTML='<i class="ti ti-refresh"></i>最新情報を読込';
}

/* ──── 初期化 ──── */
(async ()=>{
  loadFavorites();
  loadManualPapers();
  loadLocalDetails();
  applyTheme(localStorage.getItem("ortho_theme")||"blue");
  showNotice("loading","データを読み込み中...");
  await loadAll();
  document.getElementById("noticeBar").style.display="none";
  render();
})();
</script>
