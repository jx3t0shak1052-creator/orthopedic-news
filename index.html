<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>整形外科 情報ダイジェスト</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231D4ED8'/><line x1='10.7' y1='10.7' x2='21.3' y2='21.3' stroke='white' stroke-width='5.3' stroke-linecap='round'/><circle cx='7.3' cy='7.3' r='4.8' fill='white'/><circle cx='11' cy='3.7' r='3' fill='white'/><circle cx='3.7' cy='3.7' r='3' fill='white'/><circle cx='24.7' cy='24.7' r='4.8' fill='white'/><circle cx='28.3' cy='28.3' r='3' fill='white'/><circle cx='21' cy='28.3' r='3' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F0F4F8;--surface:#FFF;--border:#E2E8F0;--border-strong:#CBD5E1;
      --text-primary:#0F172A;--text-secondary:#475569;--text-muted:#94A3B8;
      --accent:#1D4ED8;--accent-bg:#EFF6FF;--accent-text:#1E40AF;
      --success-bg:#ECFDF5;--success-text:#065F46;
      --danger-bg:#FEF2F2;--danger-text:#991B1B;
      --detail-bg:#F8FAFF;
      --radius:10px;--radius-lg:14px;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#0F172A;--surface:#1E293B;--border:#334155;--border-strong:#475569;
        --text-primary:#F1F5F9;--text-secondary:#94A3B8;--text-muted:#64748B;
        --accent-bg:#1E3A8A;--accent-text:#93C5FD;
        --success-bg:#064E3B;--success-text:#6EE7B7;
        --danger-bg:#7F1D1D;--danger-text:#FCA5A5;
        --detail-bg:#1a2744;
      }
    }
    body{font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text-primary);font-size:14px;line-height:1.6;min-height:100vh}
    .header{background:var(--surface);border-bottom:.5px solid var(--border);position:sticky;top:0;z-index:100}
    .header-inner{max-width:760px;margin:0 auto;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .logo{display:flex;align-items:center;gap:9px}
    .logo-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .logo h1{font-size:14px;font-weight:700}
    .logo p{font-size:10px;color:var(--text-muted);margin-top:1px}
    .header-right{display:flex;align-items:center;gap:8px}
    .update-badge{font-size:11px;color:var(--text-muted)}
    .icon-btn{width:32px;height:32px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
    .mode-bar{background:var(--surface);border-bottom:.5px solid var(--border);position:sticky;top:62px;z-index:95}
    .mode-inner{max-width:760px;margin:0 auto;padding:.5rem 1rem;display:flex;gap:8px}
    .mode-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;border:.5px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;font-family:inherit}
    .mode-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
    .subtabs-wrap{background:var(--surface);border-bottom:.5px solid var(--border);position:sticky;top:110px;z-index:90}
    .subtabs{max-width:760px;margin:0 auto;padding:.5rem 1rem;display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .subtabs::-webkit-scrollbar{display:none}
    .stab{padding:4px 11px;border-radius:14px;font-size:12px;font-weight:500;border:.5px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
    .stab.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
    .main{max-width:760px;margin:0 auto;padding:0 1rem 6rem}
    .notice{display:none;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);margin:1rem 0 0;font-size:13px}
    .count-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0 .5rem;font-size:12px;color:var(--text-muted)}
    .paper-list{display:flex;flex-direction:column;gap:8px}
    .new-divider,.old-divider{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:11px;font-weight:500}
    .new-divider{color:var(--success-text)}.new-divider::after{content:'';flex:1;height:.5px;background:var(--success-text);opacity:.3}
    .old-divider{color:var(--text-muted)}.old-divider::after{content:'';flex:1;height:.5px;background:var(--border)}
    .card{background:var(--surface);border-radius:var(--radius-lg);border:.5px solid var(--border);overflow:hidden}
    .card-header{padding:13px 15px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
    .card-header:hover{background:rgba(0,0,0,.018)}
    @media(prefers-color-scheme:dark){.card-header:hover{background:rgba(255,255,255,.03)}}
    .card-meta{display:flex;align-items:center;justify-content:space-between}
    .badges{display:flex;gap:5px;flex-wrap:wrap}
    .badge{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
    .card-title{font-size:13px;font-weight:500;line-height:1.5}
    .card-journal{font-size:11px;color:var(--text-muted)}
    .card-body{border-top:.5px solid var(--border);padding:13px 15px;display:flex;flex-direction:column;gap:11px}
    .section-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px}
    .section-text{font-size:13px;line-height:1.65}
    .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
    .detail-btn,.fav-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
    .detail-btn{border:.5px solid var(--accent);background:var(--accent-bg);color:var(--accent-text)}
    .detail-btn:hover{background:var(--accent);color:#fff}
    .fav-btn{border:.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary)}
    .fav-btn.on{border-color:#fecdd3;background:#fff1f2;color:#e11d48}
    .detail-panel{margin-top:12px;border-radius:var(--radius);background:var(--detail-bg);border:.5px solid var(--border-strong);overflow:hidden;display:none}
    .detail-panel-header{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:.5px solid var(--border);font-size:12px;font-weight:700;color:var(--accent-text)}
    .detail-section{padding:10px 14px;border-bottom:.5px solid var(--border)}
    .detail-section:last-child{border-bottom:none}
    .detail-section-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px}
    .detail-section-text{font-size:12px;line-height:1.7}
    .detail-loading{padding:20px;text-align:center;font-size:13px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:8px}
    .implant-list{display:flex;flex-direction:column;gap:10px}
    .implant-card{background:var(--surface);border-radius:var(--radius-lg);border:.5px solid var(--border);overflow:hidden}
    .implant-header{padding:12px 15px;display:flex;align-items:center;justify-content:space-between}
    .implant-name{font-size:14px;font-weight:700}
    .stars{font-size:16px;letter-spacing:1px}
    .implant-items{border-top:.5px solid var(--border)}
    .implant-item{padding:10px 15px;border-bottom:.5px solid var(--border);display:flex;flex-direction:column;gap:4px}
    .implant-item:last-child{border-bottom:none}
    .implant-item-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .cat-badge{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:500}
    .implant-item-title{font-size:13px;font-weight:500}
    .implant-item-summary{font-size:12px;color:var(--text-secondary);line-height:1.6}
    .no-news{padding:10px 15px;font-size:12px;color:var(--text-muted)}
    .fab-wrap{position:fixed;bottom:1.5rem;right:1rem;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    @media(min-width:820px){.fab-wrap{right:calc(50vw - 380px + 1rem)}}
    .fab{display:flex;align-items:center;gap:7px;padding:13px 20px;background:var(--accent);color:#fff;border:none;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(29,78,216,.38)}
    .fab:hover{background:#1E40AF}.fab:disabled{opacity:.6;cursor:not-allowed}
    .round-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:14px}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:1rem}
    .overlay.open{display:flex}
    .modal{background:var(--surface);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
    .modal h2{font-size:15px;font-weight:700;margin-bottom:1rem}
    .modal label{display:block;font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:4px}
    .modal input{width:100%;padding:9px 12px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:var(--bg);color:var(--text-primary);font-size:13px;font-family:monospace;outline:none}
    .modal input:focus{border-color:var(--accent)}
    .modal-note{font-size:11px;color:var(--text-muted);margin-top:.5rem;line-height:1.6}
    .modal-note a{color:var(--accent)}
    .modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
    .btn{padding:8px 14px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);font-size:13px;cursor:pointer;font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn-danger{color:#DC2626}
    .theme-label{font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:10px}
    .swatches{display:flex;gap:10px;flex-wrap:wrap}
    .swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center}
    .swatch.active{border-color:var(--text-primary)}
    .swatch-name{font-size:10px;color:var(--text-muted);text-align:center;margin-top:2px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{display:inline-block;animation:spin .8s linear infinite}
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
          <line x1="8" y1="8" x2="16" y2="16" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <circle cx="5.5" cy="5.5" r="3.6"/><circle cx="8.2" cy="2.8" r="2.3"/><circle cx="2.8" cy="2.8" r="2.3"/>
          <circle cx="18.5" cy="18.5" r="3.6"/><circle cx="21.2" cy="21.2" r="2.3"/><circle cx="15.8" cy="21.2" r="2.3"/>
        </svg>
      </div>
      <div>
        <h1>整形外科 情報ダイジェスト</h1>
        <p>論文エビデンス ＆ 国内インプラント動向 <span style="opacity:.5">v4.2</span></p>
      </div>
    </div>
    <div class="header-right">
      <span class="update-badge" id="updateBadge"></span>
      <button class="icon-btn" onclick="openSettings()" title="設定" aria-label="設定">
        <i class="ti ti-settings" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>

<div class="mode-bar">
  <div class="mode-inner">
    <button class="mode-btn active" id="btnPapers" onclick="setMode('papers')">
      <i class="ti ti-file-text" aria-hidden="true"></i>論文
    </button>
    <button class="mode-btn" id="btnImplants" onclick="setMode('implants')">
      <i class="ti ti-building-factory-2" aria-hidden="true"></i>インプラントニュース
    </button>
  </div>
</div>

<div class="subtabs-wrap" id="subtabsWrap">
  <div class="subtabs" id="subtabs"></div>
</div>

<main class="main">
  <div class="notice" id="noticeBar" role="status" aria-live="polite">
    <i class="ti ti-loader spin" id="noticeIcon" aria-hidden="true"></i>
    <span id="noticeText"></span>
  </div>
  <div class="count-row">
    <span id="countLabel"></span>
    <span id="subLabel"></span>
  </div>
  <div id="content"></div>
</main>

<div class="fab-wrap">
  <button class="round-btn" onclick="openTheme()" title="テーマ変更" aria-label="テーマ変更">
    <i class="ti ti-palette" aria-hidden="true"></i>
  </button>
  <button class="fab" id="fetchBtn" onclick="reloadAll()">
    <i class="ti ti-refresh" aria-hidden="true"></i>最新情報を読込
  </button>
</div>

<!-- 設定モーダル -->
<div class="overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>設定</h2>
    <label for="geminiKeyInput">Gemini APIキー（手動取得用・任意）</label>
    <input type="password" id="geminiKeyInput" placeholder="AIza...">
    <p class="modal-note">
      設定すると「最新情報を読込」で新しい論文をリアルタイム取得できます。<br>
      <a href="https://aistudio.google.com" target="_blank" rel="noopener">aistudio.google.com</a>から無料で取得できます。
    </p>
    <div id="keyStatus" style="font-size:12px;color:var(--success-text);margin-top:.5rem;min-height:16px"></div>
    <div class="modal-row">
      <button class="btn btn-danger" onclick="clearKey()">削除</button>
      <button class="btn" onclick="testApi()">接続テスト</button>
      <button class="btn" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveKey()">保存</button>
    </div>
    <div id="testResult" style="font-size:12px;margin-top:.75rem;padding:8px;border-radius:6px;display:none"></div>
  </div>
</div>

<!-- テーマモーダル -->
<div class="overlay" id="themeOverlay" onclick="if(event.target===this)closeTheme()">
  <div class="modal">
    <h2>カラーテーマ</h2>
    <div class="swatches" id="swatches"></div>
    <div class="modal-row">
      <button class="btn btn-primary" onclick="closeTheme()">閉じる</button>
    </div>
  </div>
</div>

<script>
/* ──── 定数 ──── */
const SPECIALTIES = ["すべて","お気に入り","脊椎","肩","肘","手指","股関節","膝","外傷"];
const SP_STYLE = {
  "脊椎":{bg:"#F5F3FF",text:"#6D28D9"},"肩":{bg:"#EFF6FF",text:"#1E40AF"},
  "肘":{bg:"#ECFEFF",text:"#155E75"},"手指":{bg:"#ECFDF5",text:"#065F46"},
  "股関節":{bg:"#FFFBEB",text:"#92400E"},"膝":{bg:"#FEF2F2",text:"#991B1B"},
  "外傷":{bg:"#F8FAFC",text:"#475569"}
};
const SP_ICONS = {
  "脊椎":`<svg width="11" height="14" viewBox="0 0 11 14" fill="currentColor"><rect x=".5" y="0" width="10" height="3" rx="1"/><rect x=".5" y="4" width="10" height="3" rx="1"/><rect x=".5" y="8" width="10" height="3" rx="1"/><rect x=".5" y="11" width="10" height="3" rx="1"/></svg>`,
  "肩":`<svg width="14" height="12" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 10 C4 3 12 2 13 7"/><circle cx="13" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="2.5" cy="9.5" r="1.5" fill="currentColor" stroke="none"/></svg>`,
  "肘":`<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="2" y1="1" x2="7" y2="8"/><line x1="7" y1="8" x2="12" y2="8"/><circle cx="7" cy="8" r="2.2" fill="currentColor" stroke="none"/></svg>`,
  "手指":`<svg width="13" height="14" viewBox="0 0 13 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2.5" y1="13" x2="2.5" y2="7"/><line x1="5.5" y1="13" x2="5.5" y2="4"/><line x1="8.5" y1="13" x2="8.5" y2="5"/><line x1="11" y1="13" x2="11" y2="7.5"/><line x1="1" y1="13" x2="12" y2="13"/></svg>`,
  "股関節":`<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="5" r="3.2"/><circle cx="6" cy="5" r="1.3" fill="currentColor" stroke="none"/><path d="M8 8 Q10 10 11 13"/><path d="M4 8 Q2 10 1 13"/></svg>`,
  "膝":`<svg width="11" height="15" viewBox="0 0 11 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5.5" y1="0" x2="5.5" y2="5"/><ellipse cx="5.5" cy="8" rx="4" ry="3"/><circle cx="5.5" cy="8" r="1.5" fill="currentColor" stroke="none"/><line x1="5.5" y1="11" x2="5.5" y2="15"/></svg>`,
  "外傷":`<svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><rect x="5" y="1" width="3" height="11" rx="1.5"/><rect x="1" y="5" width="11" height="3" rx="1.5"/></svg>`
};
const RATING_COLORS = [
  {text:"#94A3B8"},{text:"#A16207"},{text:"#92400E"},{text:"#991B1B"}
];
const CAT_STYLE = {
  "新製品":{bg:"#EFF6FF",text:"#1E40AF"},"薬事承認":{bg:"#F0FDF4",text:"#166534"},
  "臨床データ":{bg:"#F5F3FF",text:"#6D28D9"},"提携・契約":{bg:"#FFFBEB",text:"#92400E"},
  "人事":{bg:"#F8FAFC",text:"#475569"},"その他":{bg:"#F8FAFC",text:"#64748B"}
};
const THEMES = [
  {id:"blue",  name:"クール",    color:"#1D4ED8",accent:"#1D4ED8",accentBg:"#EFF6FF",accentText:"#1E40AF",bg:"#F0F4F8",surface:"#FFF",textPrimary:"#0F172A",textSecondary:"#475569",border:"#E2E8F0"},
  {id:"green", name:"フォレスト",color:"#059669",accent:"#059669",accentBg:"#ECFDF5",accentText:"#065F46",bg:"#F0FAF6",surface:"#FFF",textPrimary:"#0F172A",textSecondary:"#475569",border:"#D1FAE5"},
  {id:"purple",name:"ラベンダー",color:"#7C3AED",accent:"#7C3AED",accentBg:"#F5F3FF",accentText:"#5B21B6",bg:"#F7F5FF",surface:"#FFF",textPrimary:"#0F172A",textSecondary:"#475569",border:"#E9D5FF"},
  {id:"amber", name:"サンセット",color:"#D97706",accent:"#D97706",accentBg:"#FFFBEB",accentText:"#92400E",bg:"#FDF8F0",surface:"#FFF",textPrimary:"#0F172A",textSecondary:"#475569",border:"#FDE68A"},
  {id:"dark",  name:"ナイト",   color:"#1E293B",accent:"#3B82F6",accentBg:"#1E3A8A",accentText:"#93C5FD",bg:"#0F172A",surface:"#1E293B",textPrimary:"#F1F5F9",textSecondary:"#94A3B8",border:"#334155"}
];

/* ──── 論文データ ──── */

const BASE_DETAILS = {"s1":{"background":"腰椎変性すべり症を伴う脊柱管狭窄症に対する手術は、長年にわたり除圧+固定術が標準とされてきた。しかし固定術は手術時間・出血量・合併症リスクが高く、医療費も大幅に増加する。除圧単独で同等の転帰が得られるかどうかは、整形外科領域で最も重要な臨床的論争の一つであった。特に高齢化社会の日本では、より低侵襲な術式の確立が急務とされていた。","methodology":"スウェーデンの多施設RCT（SSSS試験）として、変性すべりの有無にかかわらず247例を除圧+固定群と除圧単独群に無作為化し5年追跡した。主要転帰はODI（Oswestry Disability Index）、副次転帰には歩行距離・VAS・EQ-5Dを含む。ITT（intention-to-treat）解析を採用し、2年時点でのMRI再評価も実施した。","keyFindings":"5年時点でODIに両群間の有意差はなく、固定追加による上乗せ効果は認められなかった。さらに副次転帰3項目では除圧単独群が有意に優れた。2年MRI評価では固定群で隣接椎間への狭窄再発が有意に多く認められ、固定が隣接椎間障害を促進する可能性が示唆された。","clinicalImpact":"本研究はSLIP試験・Nordsten試験と合わせて、変性すべりを伴う腰椎脊柱管狭窄症への固定術追加の有効性を否定する高品質エビデンスの第三の柱となった。日本では固定術の実施割合が高く、過剰手術の見直しを促す重要なデータとなる。特に高齢者・骨粗鬆症合併例では、低侵襲な除圧単独が患者にとって合理的な選択肢となりうる。","limitations":"スウェーデン単国のデータであり、日本人の体型・骨質・生活様式との差異を考慮する必要がある。また5年追跡での結論であり、10年以上の長期では固定術の有効性が出てくる可能性も否定できない。","relatedEvidence":"SLIP試験（NEJM 2016）・Nordsten試験（BMJ 2019）と合わせて3つのRCTが一貫して「固定術の上乗せ効果なし」を示している。2023年のAOSpineガイドラインも「変性すべり合併狭窄症への固定術適応は限定的」と改訂した。"},"s2":{"background":"脊椎後方固定術後の手術部位感染（SSI）は発生率1〜12%と高く、再手術・入院延長・医療費増大をもたらす深刻な合併症である。術野バンコマイシン粉末（IVP）の局所投与は低コスト・簡便な感染予防策として2010年代から急速に普及し、多くの施設でルーチン使用されてきた。しかし後向き研究が多く、高品質なRCTによる有効性検証が不十分なまま普及したという経緯がある。","methodology":"PubMed・Embase・Cochraneを網羅的に検索し、IVPとSSIを比較したRCTのみを対象としたメタ解析を実施した。6件のRCT・2140例（IVP群1058例・対照群1082例）をrandom-effectsモデルで統合解析。主要転帰は深部SSI、副次転帰には浅部SSI・全SSI・バンコマイシン耐性菌感染を含む。同時期に発表されたSTRIVE試験の後向き再解析も補完データとして参照した。","keyFindings":"メタ解析では深部SSI（OR 0.71、95%CI 0.43〜1.19）・浅部SSI・総SSIのいずれにも有意差なし。一方、単施設RCT（357例 vs 348例）では深部SSIが0% vs 1.4%（p=0.029）と有意差が出たが、浅部SSIはIVP群で逆に高い傾向（2% vs 0.9%）があった。STRIVE試験後向き解析でも有意差なし。","clinicalImpact":"日本の多くの施設でIVPはルーチン使用されているが、本メタ解析はその根拠の乏しさを明示した。抗菌薬の適切使用推進（AMS）の観点からも、リスクベースの選択的使用への移行が求められる。ただし高リスク症例（肥満・糖尿病・免疫不全・長時間手術）への限定使用は合理性がある可能性がある。","limitations":"対象RCTは6件と少なく、各試験の患者背景・術式・抗菌薬プロトコルに不均一性がある。スイスのVANCO試験（多施設RCT、2026年7月完了）の最終結果が出るまで決定的な結論は出せない。","relatedEvidence":"Vienna単施設RCTの副次解析（Spine 2026年7月）では、IVPが術後の細菌スペクトルや薬剤耐性パターンを変化させないことが確認された。IVPは低コストであり、完全な中止より高リスク症例への絞り込みが現実的な方向性とされている。"},"s3":{"background":"椎弓根スクリューの設置精度は脊椎固定術の安全性と有効性の根幹をなし、不正確な設置は神経損傷・血管損傷・固定不全の原因となる。フリーハンド法は術者依存性が高く、イメージガイド・ナビゲーション・ロボット支援という技術進化の系譜の中で、ロボットが最高精度を達成するかどうかが世界的な関心事となっていた。特に研修医の教育ツールとしての応用可能性も注目されていた。","methodology":"2つの独立した研究を統合した。①Musculoskeletal Surgery誌（2026年7月）の系統的レビュー・メタ解析：ロボット vs CTナビゲーションを比較。②EFORT Open Rev誌（2026年1月）のアンブレラメタ解析：フリーハンド・ナビゲーション・ロボットの3者をクラスI〜IVエビデンスに基づき評価。許容可能スクリュー設置（Gertzbein-Robbins分類A・B）を主要評価指標とした。","keyFindings":"アンブレラメタ解析ではロボットがフリーハンドに対してOR 2.74倍（p<0.001）、CTナビゲーションに対してOR 2.36倍（p<0.001）の許容可能設置率を達成し、クラスIエビデンスとして確立された。屍体研究では、整形外科研修中のレジデントがロボット支援下でもベテラン術者と同等の設置精度を達成できることが示された。","clinicalImpact":"日本では脊椎ロボット手術の導入が大学病院・基幹病院を中心に急速に進んでいる。ロボットが術者経験に依存しない均一な高精度を実現できるという本エビデンスは、若手外科医の教育・トレーニングの標準化にも貢献しうる。コスト・設備投資という現実的障壁が残るが、精度面での優位性は揺るぎないものとなった。","limitations":"大部分の研究はレトロスペクティブであり、患者転帰（臨床的合併症率・神経障害発生率）とスクリュー設置精度の臨床的相関については長期データが不足している。学習曲線が存在し、初期導入期のデータが平均値を下げる可能性がある。","relatedEvidence":"GlobusのEXCELSIUS GPS・StrykerのMako脊椎システム・MedtronicのMazor Xなど複数プラットフォームで一貫した精度優位性が示されている。2026年の国内大学病院への導入加速と合わせ、日本脊椎外科学会でもロボット手術のガイドライン策定が進んでいる。"},"s4":{"background":"椎体テザリング（VBT）は思春期特発性側弯症（AIS）に対する骨成長温存手術として2019年FDA承認を受け、後方固定術を回避できる低侵襲な選択肢として注目を集めてきた。しかし前胸郭アプローチを要するという解剖学的特性から、肺合併症リスクが懸念されており、実際の発生率は従来報告より高い可能性があった。特に思春期患者への長期影響を考慮すると、周術期安全性の正確な把握が急務であった。","methodology":"単施設後向き解析として、VBTを施行した60例（女性51例・男性9例、平均年齢13.2歳）を対象とした。術後の肺合併症を系統的に評価し、胸部X線・CT・呼吸機能検査の結果と症状を統合してISOCD分類に基づき分類した。手術範囲（固定椎間数）・部位（胸椎 vs 腰椎）・矯正角度との相関をロジスティック回帰で解析した。","keyFindings":"60例中22例（36.7%）に肺合併症が発生し、従来報告（5〜15%）を大幅に上回った。最多は気胸（30.4%）で、胸水・無気肺・肺炎も認められた。多変量解析では固定椎間数・胸椎への手術範囲・矯正角度が独立したリスク因子として同定された。多くは保存的管理で改善したが、一部は胸腔ドレナージを要した。","clinicalImpact":"VBTは日本でも骨成長温存手術として関心が高まっているが、本研究は術前の患者カウンセリングにおいて肺合併症リスク（約3〜4割）を明示することが倫理的義務であることを示した。胸部外科・呼吸器内科との多職種連携体制と術後の厳密な呼吸管理プロトコルの整備が不可欠である。","limitations":"単施設・少数例の後向き研究であり、術者経験・施設基準が結果に影響している可能性がある。合併症の定義・分類が研究間で異なるため、他施設データとの直接比較が困難である。","relatedEvidence":"同時期に発表されたJBJS Open Access（2026年1月）の多施設前向き研究（127例）では73%の成功率が示されており、肺合併症への言及は限定的であった。本研究との乖離は患者選択・施設経験・追跡方法の差異によると考えられ、両データを総合した適応基準の精緻化が必要とされている。"},"s5":{"background":"骨粗鬆症性椎体圧迫骨折を合併する胸腰椎バースト骨折は、後方固定術施行後に椎体再虚脱（高さ消失）をきたすケースが一定頻度で存在し、追加手術や疼痛の原因となる。術前の骨質評価は従来DXA法が標準であるが、手術直前に毎回DXA測定を行う施設は少なく、簡便な代替評価法が求められていた。術前CTで測定できるHounsfield Unit（HU値）が予測指標となれば、術前計画の質が向上する可能性があった。","methodology":"単施設後向きコホート研究として、後方固定術を施行した労働年齢（18〜65歳）の胸腰椎バースト骨折患者を対象とした。術前CTのL1椎体（または骨折椎体隣接椎体）のHU値を計測し、術後3ヶ月の椎体高さ変化をCTで評価した。再虚脱の定義は術後3ヶ月で椎体高さが術直後比15%以上低下とし、ロジスティック回帰でHU値との関連を解析した。","keyFindings":"低HU値が術後3ヶ月での椎体再虚脱の独立した予測因子として同定され、ROC曲線解析でカットオフ値が設定された。HU値が低い群では有意に再虚脱率が高く、特定のHU値閾値以下では再虚脱リスクが有意に上昇した。年齢・骨折形態・固定椎間数を調整した多変量解析でも関連は維持された。","clinicalImpact":"術前CTはバースト骨折患者で必ず撮影されるため、HU値は追加検査なしに算出できる骨質の簡便な代替指標となる。日本の整形外科外来・救急外傷センターでの術前評価に容易に組み込め、低HU値患者への術式修正（椎体形成術追加・前後合併固定・骨粗鬆症治療の早期開始）の意思決定に直結する実用的な知見である。","limitations":"単施設の後向き研究であり、患者数が少ない。HU値の計測方法・ROI設定が施設間で異なる可能性があり、カットオフ値の外部妥当性検証が必要である。また骨折形態・固定方法のばらつきが結果に影響した可能性がある。","relatedEvidence":"HU値とBMDの相関は複数研究で示されており（相関係数r=0.7〜0.9）、脊椎インプラント固定力・スクリュー引き抜き強度との関連も報告されている。脊椎領域では「HU値<110で有意な骨粗鬆症リスク」とするカットオフが一部で用いられており、術前スクリーニングツールとしての標準化が今後の課題とされている。"},"sh1":{"background":"肩峰下インピンジメント症候群（subacromial pain syndrome）は整形外科外来で最も頻度の高い肩疾患の一つであり、関節鏡的肩峰下除圧術（ASD）は世界で年間数十万件施行される最多肩手術の一つである。しかし長年にわたり「偽手術（sham surgery）」と比較する真のプラセボ対照試験は存在せず、手術固有の効果なのかプラセボ効果なのかが不明なまま普及してきたという問題があった。","methodology":"フィンランド多施設三群ランダム化プラセボ手術対照試験（FIMPACT）として、肩峰下疼痛症候群患者210例（35〜65歳）を①ASD群②診断的関節鏡（偽手術）群③運動療法群に無作為化した。主要転帰はSPADI（Shoulder Pain and Disability Index）。本報告は2年・5年に続く10年追跡の最終報告。","keyFindings":"10年時点でSPADI・VAS疼痛・患者満足度のいずれにおいても、ASD群と偽手術群・運動療法群の間に統計的有意差は認められなかった。この結果は2年・5年追跡と完全に一致しており、長期にわたりASDの有効性を支持するデータが得られなかった。10年での追跡完了率は81%と良好であった。","clinicalImpact":"日本でもASDは肩関節鏡手術の中で最も多く施行されてきたが、本研究により「単独インピンジメント症候群へのASD」の適応を根本的に見直す必要性が示された。診療報酬制度のもとで施行件数が多い本邦では、過剰手術の抑制と段階的な保存療法（理学療法・注射）の徹底が求められる。腱板断裂合併例・難治性疼痛例への適応は引き続き個別に検討すべきである。","limitations":"理学療法の内容が施設間で均一でない可能性がある。除外基準が厳しく（完全層腱板断裂除外など）、実臨床の幅広い患者層への一般化には注意が必要。35〜65歳の成人に限定されており、高齢者への外挿には慎重さが求められる。","relatedEvidence":"英国のCuff試験（Lancet 2018）・SUPPORT試験も同様にASDと保存療法の間に差がないことを示しており、Cochrane Reviewは「ASDはインピンジメント症候群に対して保存療法より有効という証拠がない」と結論している。"},"sh2":{"background":"全層腱板断裂に対する手術（腱板修復術）は長年にわたり積極的に推奨されてきたが、腱板断裂の多くは無症候性であり、保存療法でも相当数の患者が症状改善を得ることが知られていた。しかし手術 vs 保存療法を長期にわたって比較したRCTは世界的にも極めて少なく、10年を超える追跡データはほぼ存在していなかった。Moosmayerらのノルウェーのコホートはそのギャップを埋める唯一無二のデータとして国際的に注目されてきた。","methodology":"ノルウェーの103例を対象とした小〜中等大全層腱板断裂のRCTで、理学療法群と腱板修復術群に無作為化した。理学療法群51例のうち15例（29%）が後に手術に移行した。15年時点で生存81例（78.6%）が評価され、Constant-Murleyスコア・ASESスコア・SF-36・患者満足度を測定した。","keyFindings":"15年時点でConstant-Murleyスコア（手術群86.9 vs 保存群84.9）・ASESスコア・SF-36・患者満足度のいずれにも両群間の有意差なし。10年時点では手術群が有意に優れていたが、15年でその差が消失した。保存療法群でも断裂サイズ拡大は認められたが、多くは機能障害なく経過した。","clinicalImpact":"本研究は「腱板断裂は早期に修復すべき」という長年の常識に再考を促す。日本でも腱板修復術は増加傾向にあるが、特に高齢者・低活動性患者・無症候性断裂では、まず質の高い理学療法を十分期間実施することが合理的であることが示された。患者インフォームドコンセントにおいてこのデータを提示することが医療倫理的に重要となる。","limitations":"サンプルサイズが小さく（103例）、統計的検出力に限界がある。ノルウェー人のデータであり、日本人の生活様式・活動レベルへの直接外挿には注意が必要。保存療法群への理学療法の質・量の均一性も課題である。","relatedEvidence":"JAAOS 2024年掲載の系統的レビューでも「無症候性腱板断裂の大多数は保存療法で良好な転帰」が示されており、本データと整合する。一方、修復可能な若年・高活動性患者・断裂拡大リスクが高い症例では引き続き早期修復の有益性が示されている。"},"sh3":{"background":"前方肩関節不安定症に合併するHill-Sachs病変（上腕骨頭後外側の骨欠損）は、肩外転外旋位で関節窩縁に嵌合（engaging）することで再脱臼の主要因となる。Bankart修復単独ではこの骨性病変に対処できないため、関節鏡的Remplissage術（棘下筋腱・後方関節包の充填固定）が開発されたが、外旋制限をもたらすという懸念から普及に躊躇する施設も多かった。","methodology":"Engaging Hill-Sachs病変を有する前方肩関節不安定症に対する①Bankart修復＋Remplissage vs ②Bankart修復単独を比較したRCT・観察研究を対象としたメタ解析（10研究・1,247例）。主要転帰は不安定性再発率、副次転帰に外旋ROM・前方挙上・ASES・Rowe scoreを含む。Ahmed et al.メタ解析を中心として、JBJS What's New in Shoulder and Elbow Surgery 2026年版で紹介された。","keyFindings":"Bankart＋Remplissage群は単独群と比較して再発率が9分の1に低下（5.3% vs 15.1%、RR 0.35、p<0.001）。外旋ROMはRemplissage群でわずかに少なかったが（平均差-4.3°）、前方挙上は逆に有意に増加（平均差+1.97°、95%CI 1.49〜2.46°、p<0.001）。患者報告アウトカムは両群で同等。","clinicalImpact":"外旋制限への懸念によりRemplissageを躊躇する外科医も多かったが、本メタ解析はその懸念を事実上否定した。日本でも肩関節不安定症手術においてEngaging Hill-Sachs病変の評価（CTによる骨欠損量計測）と適応に応じたRemplissage追加が標準化されるべきことが示された。","limitations":"対象研究の多くが後向きコホートであり、患者選択バイアスが除外できない。Engaging Hill-Sachs病変の定義・評価方法が研究間で異なるため、統一した適応基準の設定が課題である。","relatedEvidence":"2026年のOASIS試験（軍人・民間人を対象とした多施設前向き研究）がBankart・Bankart+Remplissage・Latarjetの三者比較を進行中であり、骨欠損量に応じた術式選択の最終的なエビデンスを提供することが期待されている。"},"sh4":{"background":"全人工肩関節置換術（TSA）は股関節・膝関節の人工関節置換術に比べてエビデンスの蓄積が遅れており、特に10年を超える長期生存率データは限定的であった。近年rTSAの適応が急速に拡大しているが、aTSA・rTSAそれぞれの長期インプラント生存率を国際的に比較したデータは少なく、インプラント設計の違いが生存率に与える影響も不明であった。","methodology":"CENTRAL・Embase・MEDLINEを検索し、13年以上の追跡データを報告した症例シリーズ研究と国際関節レジストリデータを統合したメタ解析（2026年7月、SAGE誌）。英国NJR・豪州AOANJRR・ノルウェー・スウェーデンの4国際レジストリに加え7症例シリーズを解析。インプラント再置換フリー生存率をKaplan-Meier法で統合推定した。","keyFindings":"aTSA 13年生存率91.50%（95%CI 89.36〜93.64）、15年生存率90.82%（95%CI 88.25〜93.38）。rTSA（ノルウェーレジストリ5494例）10年生存率94%（95%CI 93〜95%）。rTSAではDelta Xtend比でAequalis Ascend Flex（HR 2.8）・SMR（HR 2.5）などのブランドで有意に高い再置換リスク。男性（HR 2.3）・骨折後遺症（HR 3.1）・骨折例への無セメントステム（HR 3.5）が独立した再置換リスク因子として同定。","clinicalImpact":"日本ではrTSAの普及が著しく加速しているが、インプラントブランド・固定方式の選択が長期生存率に直結することが示された。骨折後遺症・若年男性・セメントレス固定例ではリスクが高く、術前の個別化評価と患者カウンセリングが重要である。","limitations":"レジストリデータは再置換を転帰指標とするため、患者報告アウトカムや痛み・可動域の長期変化は別途評価が必要。インプラント設計の変化速度が速く、古い設計のデータが現在の標準を代表しない可能性がある。","relatedEvidence":"JAAOS 2026年掲載のMount Sinai単施設研究（78肩・平均追跡15年）でもaTSAの良好な長期転帰が示されており、関節窩コンポーネントの弛緩が依然として主要な制限因子であることが確認された。"},"sh5":{"background":"外傷性前方肩関節不安定症（TASI）は若年コンタクトアスリートに多く、治療方針（保存 vs 手術・術式選択）については施設・外科医による大きな差異があり、統一されたガイドラインが存在しなかった。特に初回脱臼への早期手術適応、年齢別の対応、スポーツ復帰基準については国際的なコンセンサスが求められていた。","methodology":"ESSKA（欧州スポーツ外傷・膝外科・関節鏡学会）とESA（欧州肩関節外科学会）が共同で実施した公式フォーマルコンセンサスプロセス。9カ国15人のステアリンググループ・18カ国18人の評価グループ・13カ国28人のリーダーグループが参加。23の臨床質問についてデルファイ法による反復投票と構造化文献検討を実施した。","keyFindings":"23の臨床質問に対して強い合意11件・相対的合意11件・不確定1件を達成。主要推奨：①20歳未満コンタクトアスリートの初回脱臼には早期手術（Bankart修復）を強く推奨。②20〜40歳の初回脱臼は骨欠損量・活動性・患者希望に基づく個別化。③再発不安定症全例で手術適応。④RTS基準として単なる時間経過でなく機能的評価・心理的準備度の達成を重視。","clinicalImpact":"従来「初回脱臼は保存療法」という考え方が主流だったが、本コンセンサスは若年コンタクトアスリートへの早期手術を明確に推奨し、日本の診療標準化に大きな影響を与える。特に高校・大学のラグビー・アメフト・柔道選手への対応が変わりうる重要なデータである。","limitations":"コンセンサスは専門家意見の統合であり、各推奨の基盤となるRCTエビデンスは限定的なものが多い。文化的背景・医療システムの違いから、日本への適応には文脈的解釈が必要な部分もある。","relatedEvidence":"MOON Shoulder Group（JBJS 2026年）の多施設前向きデータでは、Latarjet vs ABRの再発率差が僅少であることが示されており、術式選択の個別化（骨欠損量・競技種目・患者希望）が依然として重要であることが確認されている。"},"sh6":{"background":"関節鏡的Latarjet術はコラコイドプロセスを前下方関節窩に移行固定する手術であり、骨性安定性と腱による動的安定性の二重効果を持つ。しかし術後のコラコイドグラフト骨吸収は高率（文献上47〜100%）に生じることが知られており、その臨床的意義については「骨融合で安定性が得られれば吸収は問題ない」という従来の見解があった。新たなCRDL分類はこの定説を系統的に検証した初の研究として注目された。","methodology":"関節鏡的Latarjet術を施行した患者を対象に、術後CTでコラコイドグラフトの骨吸収パターンを評価する新分類システム「CRDL（Coracoid Resorption Degree and Location）」を開発・検証した研究（Am J Sports Med 2026年3月）。グラフト吸収グレード（0〜3）と部位（上面・下面・内側・外側）を評価し、術後ASES・VASスコアとの相関を解析した。","keyFindings":"CRDL Grade 3（高度吸収：50%以上のグラフト消失）ではGrade 0・1と比較してASESスコアが有意に低く（平均差-12.3点）、VASスコアが有意に高かった（平均差+1.8点）。安定性指標（再脱臼率・apprehension test）には有意差なし。グラフト近位部表層内側域が最も顕著な吸収部位（67.69%）。高齢・喫煙・大きな骨欠損が骨吸収のリスク因子。","clinicalImpact":"高度コラコイド吸収が疼痛増加と機能低下と関連するという本結果は、術後定期CTフォローの重要性を示す。日本でのLatarjet手術増加に伴い、高リスク患者（喫煙者・高齢者・大骨欠損例）への術前カウンセリングと固定方法の最適化（スクリュー vs ループ固定）の検討が求められる。","limitations":"単施設研究で患者数が限定的。CRDLシステムの観察者間信頼性の検証が不十分。吸収の経時的変化（何年で安定するか）のデータがない。","relatedEvidence":"コラコイド骨融解の予測因子を評価したメタ解析（Am J Sports Med 2026年）では、グラフト吸収の平均度合いは48.5%±8.2%に達し、年齢・喫煙・関節窩骨欠損量が有意な予測因子として同定されており、本研究の知見と整合している。"},"sh7":{"background":"修復不能巨大腱板断裂（IMRCT）に対する治療は長年の難題であり、rTSA（逆行性全人工肩関節置換術）が高齢者の標準治療として定着してきた一方、若年患者への関節置換は耐久性の問題から躊躇されてきた。関節温存的手術として上方関節包再建術（SCR）が2013年に開発・報告されたが、SCRとrTSAの直接比較データは限定的であり、特に合併症率の比較は明確でなかった。","methodology":"PRISMA 2020準拠のシステマティックレビュー・メタ解析として、SCRとrTSAを比較した7件・430例を解析（Clin Orthop Surg 2026年6月）。機能スコア（ASES・Constant）・VAS・ROM・再手術率・全合併症率をrandom-effectsモデルで統合。対象は関節炎を伴わないIMRCT。","keyFindings":"機能スコア（ASES・Constant）・VAS・外転・前方挙上のすべてで両群間に統計的有意差なし。しかしSCRの全合併症率がrTSAより有意に低かった（3.5% vs 10.8%、OR 0.32、95%CI 0.12〜0.84、p=0.020）。グラフト不全・関節窩コンポーネント弛緩・感染が主要合併症の差異をもたらした。","clinicalImpact":"日本では若年者（60歳未満）のIMRCTに対してrTSAの適応に躊躇することが多く、本データはSCRが機能的に同等でありながら合併症が少ないという根拠を提供した。特に60歳未満・活動性の高い患者ではSCRを第一選択として検討することが支持される。","limitations":"対象研究数が少なく、患者背景の不均一性が大きい。SCRのグラフト材料（ADM・自家筋膜・PEEK等）が研究間で異なる。長期（5年以上）の追跡データが限定的であり、グラフト耐久性に関する結論は暫定的なものである。","relatedEvidence":"International Orthopaedics 2025年では、revision SCRは一次SCRと比較して有意に劣る転帰が示されており、初回手術の重要性が強調されている。同種真皮移植（ADM）が最も広く使用されており、筋膜大腿自家移植は採取部罹患の問題があるが生着率が高い。"},"sh8":{"background":"rTSA（逆行性全人工肩関節置換術）のrevision手術は、感染・不安定性・インプラント破損などの合併症に対して施行されるが、その難度は極めて高い。英国では関節形成術の質管理としてNational Joint Registry（NJR）が運営されており、rTSA revisionの実態と、さらにそのrevision後（re-revision）の転帰・術者経験が初めて大規模に分析された。","methodology":"英国NJR（26403例・平均追跡4.9年）とHospital Episode Statistics（HES）を統合し、2012〜2022年にrTSA revisionを施行した685例を同定した研究（PMC 2026年7月）。re-revision率・原因・術者別年間手術件数を解析。比例ハザードモデルでre-revisionの予測因子を同定した。","keyFindings":"685例のrTSA revision後のre-revision率は34%と高率。revision手術を行った術者244名の中央値はわずか4例/10年（IQR 2〜7例）で、大多数の術者が少数例しか経験していなかった。感染（32%）・不安定性（28%）・インプラント破損（18%）がre-revision主要原因。高ボリューム術者（年間≥10件）は低ボリューム術者と比較して有意にre-revision率が低かった。","clinicalImpact":"「手術経験の少ない術者によるrTSA revision」がre-revisionの主要リスク因子である実態が明らかになった。日本でも肩関節形成術のrevision手術は限られた専門施設・術者に集約すべきであり、学会主導のrevision手術認定制度の整備が急務とされる。","limitations":"英国のデータであり、医療システム・手術件数が日本と異なる。NJRのデータは手術種別の精度に依存しており、一部の症例は分類が不正確な可能性がある。","relatedEvidence":"米国AJRRの大規模データでもrTSA revisionの合併症率はTHA・TKA revisionより有意に高く、「肩関節revision専門施設」への集約化が世界的トレンドとなっている。"},"el1":{"background":"小児肘内側上顆骨折は転位骨折の場合、長年にわたり手術固定が推奨されてきた。しかしその根拠は後向き研究や専門家意見に基づくものが多く、高品質なRCTは存在していなかった。特に「手術で骨片を固定しなければ機能障害が残る」という前提が広く受け入れられていたが、実際の長期的な臨床的意義については不明確な部分が多かった。英国・豪州・NZの多施設連携により、この問いに正面から答えるRCTが実施された。","methodology":"英国・豪州・NZ 59施設・334例（7〜15歳）の多施設プラグマティックRCT。転位（≥2mm）閉鎖性肘内側上顆骨折をギプス固定群と手術固定（スクリューまたはKワイヤー）群に無作為化した。主要転帰は12ヶ月時点のPROMIS上肢スコア。費用対効果分析も実施。","keyFindings":"12ヶ月PROMIS上肢スコアに有意差なし（調整後平均差0.5、95%CI -1.4〜2.4、p=0.62）。手術群では術中合併症14件・再手術7例・スクリュー/Kワイヤー抜去17例が追加で生じた。NHS費用は手術群が£2435多く、QALYは手術群で逆に低かった（0.94 vs 0.96）。費用対効果確率は0%と算出された。","clinicalImpact":"日本の小児整形外科においても転位性内側上顆骨折への手術適応を見直す根拠となる。ただし除外基準（肘脱臼合併・神経障害合併・骨片嵌頓例）を考慮した個別化判断が必要であり、すべての転位骨折に保存療法が適用されるわけではない点に注意を要する。","limitations":"35%のクロスオーバー（保存療法→手術）があり、ITT解析の解釈に注意が必要。盲検化が不可能なオープンラベル試験である。「転位≥2mm」を手術適応とする従来基準への疑問を提示しているが、より大きな転位（≥5mm）での結果は未評価。","relatedEvidence":"小児整形外科全体での「骨折への手術介入の必要性を問い直す」潮流の中でSCIENCE試験は重要な位置を占める。同年発表のSOFIE RCT（高齢者肘頭骨折への保存療法非劣性）と合わせて、肘関節骨折の手術適応の厳格化という世界的方向性を支持するデータとなった。"},"el2":{"background":"高齢者の転位性肘頭骨折（OTA/AO 34型）は従来ほぼ全例に張力帯固定（TBW）またはプレート固定が推奨されてきた。しかし高齢者では骨粗鬆症・インプラント刺激による皮膚合併症・術後感染リスクが高く、手術関連合併症が問題となってきた。近年の小児・若年成人骨折での「保存療法ファースト」の潮流を受け、高齢者肘頭骨折でも保存療法の有効性を検証するRCTの実施が求められていた。","methodology":"豪州・NZ 24施設の多施設プラグマティックRCT（SOFIE試験）として、75歳以上の急性転位閉鎖性肘頭骨折を①手術群（TBWまたはプレート固定）②保存療法群（スリング＋早期運動）に無作為化した。主要転帰は12ヶ月時点のDASH（Disabilities of the Arm, Shoulder and Hand）スコア。非劣性マージンはDASH 10点と設定した。","keyFindings":"12ヶ月DASH（手術群22.5 vs 保存群24.3、調整後差2.2、95%CI -2.8〜7.1）に有意差なし。非劣性が示された。二次転帰のKWEC（Mayo Elbow Performance Score）も両群同等。合併症率は手術群で有意に高い傾向（インプラント刺激・皮膚壊死・感染）。","clinicalImpact":"75歳以上の高齢者では転位性肘頭骨折に対して保存療法（スリング＋早期運動）が手術と同等の12ヶ月機能転帰をもたらすことが高品質RCTで確認された。日本の高齢化社会において、過剰な手術介入を避けつつ適切な早期離床・機能訓練を提供する診療モデルの標準化が求められる。","limitations":"12ヶ月追跡のデータであり、長期での変形性関節症進行・機能変化については不明。転位が大きい骨折（三頭筋断裂合併・骨片多数の粉砕型）は除外されており、全症例への適用は慎重を要する。","relatedEvidence":"スイスで2026年2月に開始された肘頭骨折の新RCT（NCT07400692）も同様の研究仮説で進行中。TBW vs 保存療法 vs プレート固定の三者比較も将来的な研究課題とされており、インプラント選択の問題も含めた総合的な評価が待たれる。"},"el3":{"background":"肘内側側副靭帯（UCL）損傷に対する再建術（Tommy John手術）は投球スポーツ選手の標準治療として50年以上の歴史を持つが、再建術失敗後のRevision手術は最も難渋する上肢スポーツ手術の一つであり、再競技復帰率40〜60%という不良な転帰が報告されていた。一方、UCL修復にコラーゲンコーティングsuture tape（Internal Brace）を用いた新術式はRCTで再建術と同等の成績が示されており、Revision手術への応用が期待されていた。","methodology":"ASMI（American Sports Medicine Institute）での後向き研究として、UCL再建術失敗後にRevision UCL repair with Internal Braceを施行したプロ（45%）・大学（55%）レベル投手11例を対象とした（平均追跡2.9年、OJSM 2026年4月）。ASES肘スコア・Kerlan-Jobe（KJOC）スコア・Andrews-Carsonスコアおよびスポーツ復帰（RTS）率を評価した。","keyFindings":"全11例（100%）が術前レベル以上への競技復帰を達成した。競技復帰までの平均期間は9.0ヶ月（従来のRevision再建術の12〜18ヶ月より大幅短縮）。ASES肘スコア平均35.8/36・KJOCスコア・Andrews-Carsonスコアも良好。重篤な合併症なし。","clinicalImpact":"Revision UCL再建術の不良成績に悩んできたスポーツ整形外科医に対して、Internal Brace修復という新たな選択肢の有効性を示した。日本でも野球・ソフトボール選手のUCL損傷が増加しており、特に一次再建術失敗後の選択肢として今後の注目度が高い術式となる。","limitations":"症例数が11例と極めて少なく、エビデンスレベルはケースシリーズ（Level 4）に留まる。平均追跡2.9年と中期であり、長期的な再損傷率・UCL弛緩の評価が必要。プロ・大学投手に限定されており、一般アマチュア投手への適用可能性は別途検討が必要。","relatedEvidence":"日本発のshoelace修復＋Internal Brace技術（百岳整形外科スポーツクリニック、JSEINT 2026年）では、慢性骨片合併例を含む学生野球選手18例でも良好な成績が報告されており、本結果と整合する。"},"el4":{"background":"遠位上腕二頭筋腱断裂は主に中年男性（30〜60歳）の過負荷または急性外傷で生じ、完全断裂には手術が標準とされる一方、部分断裂への最適な対応は不明確であった。特に断裂深度50%未満の部分断裂に対して手術を急ぐべきか、保存療法で経過を見るべきかについてはエビデンスが極めて乏しく、外科医の経験的判断に依存していた。","methodology":"単施設ケースコントロール研究として、MRIで確認された部分断裂（グレード1〜3）患者を対象に保存療法（安静・理学療法）を施行した。6週・12週・6ヶ月の各時点でCOGO（Clinical Observer Global Outcome）・VAS・関節可動域・握力・VRI（velocity of recovery index）を評価し、回復不十分例には手術（腱固定術）を提示した（JSES 2026年1月）。","keyFindings":"グレード<50%（グレード1〜2）の部分断裂において、6ヶ月時点で83%が「完全回復」の基準を達成した。残り17%は保存療法無効として腱固定術が施行された。グレード50%以上（グレード3）では保存療法成功率が低下する傾向が認められた。平均回復期間は4.2ヶ月。","clinicalImpact":"部分遠位上腕二頭筋腱断裂の8割以上が保存療法で回復するというデータは、外科的介入前に十分な保存期間（最低6ヶ月）を設けることを支持する。日本でも超音波・MRIの普及で部分断裂の診断機会が増えており、断裂深度による層別化治療方針の標準化に活用できるデータである。","limitations":"単施設の少数例研究（症例数非記載の要約）であり、選択バイアスの可能性がある。「完全回復」の定義が研究者主観的評価に依存している。グレードの境界設定の再現性にも課題がある。","relatedEvidence":"完全断裂に対するSOFIE試験（肘頭骨折RCT）との類比から、「肘部位の断裂には保存療法ファースト」という潮流が形成されつつある。JSES 2020年の系統的レビューでも「部分断裂の多くは手術なく回復する」ことが示されており、本研究の知見と整合する。"},"ha1":{"background":"指尖部切断再接着は手の外科の中で最も技術的に要求度が高い手術の一つであり、虚血時間・損傷機転・静脈吻合本数などの因子が生存率に影響することが経験的に知られていた。しかし従来の「温虚血6時間・冷虚血12時間」という制限は動物実験・少数症例報告から外挿されたものであり、大規模な検証はなされていなかった。また2点識別覚や把持力などの機能的転帰についても統合的なデータは乏しかった。","methodology":"PubMed・Scopus・SpringerLink・Google Scholarを検索し、指尖部切断再接着の成績を報告した25研究・7278断指を対象としたメタ解析（Eur J Plast Surg 2026年3月）。PRISMA 2020に準拠。主要転帰は生存率。副次転帰はTAM（Total Active Motion）・2点識別覚・DASHスコアとした。予後因子のサブグループ解析も実施した。","keyFindings":"生存率は50〜100%（中央値85%）と研究間のばらつきが大きかった。多変量解析では鋭利損傷（OR 2.8）・短い虚血時間（OR 1.9/時間）・2本静脈吻合（OR 3.1 vs 1本）が独立した生存率予測因子として同定された。TAM中央値67.5°（正常の約70%）、2点識別覚加重平均5.6mm、DASHスコア9.64と機能的転帰は概ね良好であった。","clinicalImpact":"2本静脈吻合の重要性が大規模データで再確認されたことは実践的意義が大きい。また「温虚血6時間」の制限に根拠が乏しいという知見は、特に冷虚血（氷冷保存）であれば大幅な延長が許容される可能性を示唆し、長距離搬送例での再接着適応判断に影響する。","limitations":"研究間の患者選択基準・手術手技・術後管理プロトコルの不均一性が大きく、メタ解析のI²が高い。生存率の定義（完全生存 vs 部分生存）が研究間で異なる。単指 vs 多指・損傷部位別のサブグループ解析は限定的。","relatedEvidence":"heparinフリープロトコル・リーチ法（局所組織拡張）などの術式革新と、専門施設集約化が生存率向上に寄与してきたとする複数の観察研究と整合する。"},"ha2":{"background":"舟状骨骨折は手関節骨折の中で最も見落とされやすい骨折の一つであり、初診時X線での診断率は60〜80%と報告されている。診断遅延は偽関節・舟状骨壊死・手根部不安定症への進行リスクとなる。救急外来ではMRIが即座に利用できない場合が多く、CTも全例には施行しにくいため、X線ベースのAI診断支援ツールへの期待が高まっていた。","methodology":"過去10年間に収集した手関節X線（骨折・非骨折を含む）を用いて、YOLOv8（You Only Look Once version 8）アルゴリズムにより舟状骨を自動セグメンテーションし骨折を検出するDLSFD（Deep Learning Scaphoid Fracture Detection）フレームワークを開発・検証した研究（Electronics 2026年6月）。PA（後前位）単一方向からの骨折検出精度を評価し、データ拡張技術でモデル汎化性能を向上させた。","keyFindings":"DLSFDはmAP@0.75=0.98という高い精度で舟状骨の自動セグメンテーションと骨折検出を達成した。PA単一方向のみでの実用的診断精度が確認され、多方向撮影に依存しない実用性が示された。Diffusion Modelベースの先行研究（Diagnostics 2026年1月）との比較でも同等以上の精度であった。","clinicalImpact":"救急外来において、AI支援X線診断により舟状骨骨折の見落としを大幅に低減できる可能性がある。特に夜間・休日の当直帯や、整形外科専門医不在の施設での補助ツールとして有用性が高い。日本の地域医療機関での診断精度向上に貢献しうる実用的なAI応用として注目される。","limitations":"単施設データでの内部検証に留まり、外部多施設での汎化性能検証が必要。舟状骨以外の手根骨骨折との鑑別精度は評価されていない。AIシステムの薬事承認（PMDA）プロセスと実際の臨床実装には課題がある。","relatedEvidence":"Cureus 2025年11月の系統的レビューでは、DLモデルによる舟状骨骨折検出と骨癒合予測の両面で高精度が示されており、本研究と方向性が一致する。"},"ha3":{"background":"ゾーン2屈筋腱（A2〜A4プーリー直下）の修復後リハビリは、腱癒合と腱癒着予防という相反する目標の間でバランスを取ることが求められる最難関の領域の一つである。受動的早期運動（EPM：Duran法など）は長年のスタンダードだったが、能動的早期運動（CAM：Modified Kleinert・Place&Hold法など）がより良い転帰をもたらすという仮説が提唱されてきた。しかしCAM vs EPMを直接比較したRCTは極めて少なかった。","methodology":"前向き単施設RCTとして、ゾーン2全層屈筋腱断裂（FDP＋FDS両腱）40例をCAM群（20例）とEPM群（20例）に無作為化した。術式はFour-strand Kessler変法（4本縫合）＋epitenon連続縫合で統一。術後6週・12週でTAM（Total Active Motion）・握力・DASHスコアを盲検評価した。","keyFindings":"CAM群はEPM群より術後6週（TAM Cohen's d=11.8、握力d=7.97、DASH d=5.8）・12週（TAM d=9.9、握力d=9.7、DASH d=5.5）のすべての時点で有意に優れた（p<0.05）。12週でCAM群の80%がStrickland分類「優」（TAM≥175°）に達したのに対しEPM群では55%にとどまった。腱断端剥離（rupture）は両群とも0例。","clinicalImpact":"多ストランド修復（4本以上）後のCAMプロトコルは安全かつ効果的であることがRCTで確認された。日本の手の外科センターでも、腱修復の強度向上とCAMプロトコルの組み合わせを標準化することで機能回復を大幅に改善できる可能性がある。患者コンプライアンス確保と専門的な手の外科作業療法士（OT）との連携が実装の鍵となる。","limitations":"単施設研究で症例数が少ない（各20例）。手術術者・OTの技術レベルが結果に大きく影響するため、外部施設への適用可能性の検証が必要。追跡期間が12週と短く、1年以上の長期的な腱癒着発生率・再断裂率は不明。","relatedEvidence":"Strickland・Gelberman・Tanの基礎研究により4本以上のストランド修復でCAMが安全に実施できる引張強度が確保されていることが示されており、本RCTの結果と理論的背景が整合する。"},"ha4":{"background":"橈骨遠位端骨折（DRF）は高齢者で最も多い上肢骨折の一つであり、手術（VLP固定）が推奨されることが多い。しかし高齢者では麻酔・手術リスクが高く、骨粗鬆症による固定性の問題もある。最近のRCT（VIPER試験・SOFT試験など）では60〜65歳以上の不安定DRFに対して手術と保存療法の機能的転帰が同等という報告が相次いでおり、特にハイリスク高齢者への適応に疑問が呈されてきた。","methodology":"麻酔ハイリスク（ASA≥3）高齢患者（≥65歳）のDRFに対するVLP固定（n=35）vs ギプス固定（n=42）を比較した前向き観察研究（PMC 2026年5月）。主要転帰はPRWE・DASH・手関節ROM・握力（術後3・6・12ヶ月評価）。傾向スコア重み付けで背景因子を調整した。","keyFindings":"全評価時点（3・6・12ヶ月）でVLP固定群とギプス固定群の間にDASH・PRWE・ROM・握力の有意差なし。手術群での合併症（腱炎・神経障害・プレート刺激）が非手術群より多い傾向。骨折形態（関節内/外・転位量）による層別解析でも同様の結果が得られた。","clinicalImpact":"「関節内骨折＝手術適応」という固定観念を覆す重要なデータ。特に麻酔リスクの高い高齢患者では、機能的転帰が同等であれば保存療法を第一選択とすることが患者利益に叶う可能性がある。日本の高齢化社会において、整形外科医・麻酔科医・老年科医の多職種連携による個別化治療選択が求められる。","limitations":"観察研究であり、手術適応の選択バイアスが完全に除外できない。傾向スコア調整後も残余交絡の可能性がある。「ハイリスク」の定義（ASA≥3）が広く、患者の異質性が大きい。","relatedEvidence":"VOLCON RCT（2026年）でも65歳以上の不安定DRFに対してVLP固定と保存療法の2年転帰が同等であることが確認されており、本研究の知見と整合する。"},"hi1":{"background":"大腿骨頸部骨折（転位性）後のTHAにおける術後脱臼は最も重篤な合併症の一つであり、発生率2〜10%と高い。デュアルモビリティ（DM）カップは二重関節面（ベアリング内でポリエチレンインサートが独立して動く）により理論上の可動域が大幅に増大し脱臼リスクを低減できるとされてきたが、大規模RCTによる検証は行われていなかった。特に高齢者・骨折例でのDMカップの有効性は明確でなかった。","methodology":"英国（NIHR資金）・スウェーデン 44施設・1600例の国際多施設RCT（DUALITY試験）として、転位性大腿骨頸部骨折（≥60歳）へのTHAをDM-THA（n=800）vs 標準THA（n=800）に無作為化した。主要転帰は術後2年での脱臼率。副次転帰に再手術率・死亡率・PROMs（OHS・EQ-5D）を含む。","keyFindings":"2年脱臼率：DM-THA群1.1% vs 標準THA群3.7%（HR 0.30、95%CI 0.15〜0.60、p<0.001）、脱臼リスク70%低下。再手術率も有意に低下（DM群2.5% vs 標準群5.3%）。機能スコア（OHS・EQ-5D）・死亡率は両群間で有意差なし。","clinicalImpact":"大腿骨頸部骨折後THAにおけるデュアルモビリティカップの脱臼予防効果がRCTで確定した。日本でも高齢者股関節骨折後THAにDMカップの採用が急増しており、本RCTはその変化を科学的に正当化する決定的なエビデンスとなる。特別なトレーニング不要・即座に導入可能という点も普及を後押しする。","limitations":"2年追跡での結果であり、長期の摩耗・弛緩リスクについては追跡が必要。インプラントコストがDMカップで高いため費用対効果分析が重要。","relatedEvidence":"先行するレジストリ研究（豪州AOANJRR・英国NJR）でも大腿骨頸部骨折後THAでのDMカップが脱臼リスクを低減することが一貫して示されていた。DUALITY試験はこれをRCTで確定したものとして意義が大きい。"},"hi2":{"background":"大腿骨近位部骨折に対する超早期手術（受傷後24時間以内）の有益性は確立されているが、入院時心筋障害（MINS：手術非関連型心筋障害）を示すトロポニン上昇例では「心臓を安定させてから手術すべき」という考え方が広く受け入れられてきた。しかし手術遅延が死亡率を高めるという矛盾も存在しており、トロポニン上昇例への最適な手術タイミングは未解決の問題であった。","methodology":"HIP ATTACK試験（69施設・17カ国・2970例の国際多施設RCT）のサブグループ解析として、入院時トロポニン上昇例322例（23%）を超早期手術群（6時間以内）vs 標準治療群（24〜48時間）に分けて比較した。主要転帰は90日死亡率。心血管イベント・合併症率も評価した。","keyFindings":"90日死亡率：超早期手術群10.1% vs 標準治療群23.2%（HR 0.43、95%CI 0.24〜0.77、p=0.005）、57%の相対リスク低下。周術期心血管イベント（心筋梗塞・心停止）は両群同等。肺塞栓・院内死亡も超早期群で少ない傾向。","clinicalImpact":"トロポニン上昇を理由に手術を遅らせることが、かえって死亡率を高めている可能性が示された。日本の救命救急センターでも「内科的最適化後に手術」という従来のアルゴリズムを見直し、MINSを伴う場合にも可能な限り早期の手術（受傷後24時間以内）を目指すことが生命予後改善につながりうる。","limitations":"サブグループ解析であり、サンプルサイズが322例と限定的。トロポニン上昇の原因（急性心筋梗塞 vs MINS vs その他）別の解析が限定的。","relatedEvidence":"HIP ATTACK試験の主解析（NEJM 2020）では全体として超早期手術が主要有害心血管イベントを有意に低減することが示されており、本サブグループ解析はその恩恵がMINS合併例でも同様に得られることを示した重要な補完データである。"},"hi3":{"background":"寛骨臼形成不全（DDH）は若年者の股関節OAの主要原因であり、PAO（寛骨臼回転骨切り術）は関節温存手術として1980年代から実施されてきた。しかし10年以上の長期データは限定的であり、THAへの変換率・機能的転帰・合併症率についての多施設的なエビデンスが求められていた。特にどのような患者選択基準で最良の転帰が期待できるかの明確化が課題であった。","methodology":"臼蓋形成不全に対するPAO施行後の10年転帰を評価した多施設コホート研究（Hip Int 2026年）。THA変換・機能スコア（mHHS・WOMAC・HOOS）・活動性・合併症を評価した。長期予後因子の多変量解析も実施した。","keyFindings":"10年時点で80%以上の患者がTHAへの変換なく機能を維持した。機能スコアは術後2年で最大改善に達し以後維持された。THAへの変換率は年齢・術前OA重症度・球形性（Sphericity index）・関節軟骨状態によって大きく異なり、最良の長期予後因子は若年（35歳未満）・Tönnis 0〜1度・正常球形性の組み合わせであった。","clinicalImpact":"日本でも股関節形成不全は若年女性に多く、PAOの適応判断・患者選択の精緻化に活用できる重要なデータ。「早期（OA進行前）の手術」が長期的な関節温存につながることが明確にされ、無症候性または軽症でも形態学的基準（CE角・AI角）を満たす患者への積極的な紹介・手術を支持する根拠となる。","limitations":"多施設間の術者経験・手術手技・術後管理プロトコルの不均一性がある。日本固有の骨盤形態・日本人女性の生活様式（和式トイレ・正座）への外挿には注意が必要。","relatedEvidence":"Ganz（Bern大学）の原著シリーズ（20年追跡）と本多施設研究の結果は概ね整合し、PAOのエビデンスベースが着実に強化されていることを示す。"},"hi4":{"background":"骨粗鬆症は股関節OAと高頻度に合併し、両者に対してビスホスホネート（BP）投与とTHAが同時に管理される患者が増加している。BPによる骨量増加がTHAのインプラント固定に有利に働くという仮説がある一方、長期BP使用による骨代謝停滞（「凍りついた骨」）がインプラント周囲骨折の素地となるという相反する懸念も提唱されてきた。","methodology":"大規模医療請求データベース（Optum Clinformatics Data Mart）を用いた後向きコホート研究として、骨粗鬆症合併一次THA施行患者をBP使用群（≥6ヶ月の持続処方）と未使用群に1:1傾向スコアマッチング（各群9844例）で比較した（J Arthroplasty 2023年掲載→2026年継続参照）。主要転帰は2年の周囲骨折率・全原因再置換率。","keyFindings":"BP使用群で2年周囲骨折率が有意に高かった（OR 1.29、95%CI 1.04〜1.61、p=0.022）。全原因再置換率に有意差なし。一方、THA後に開始したBPでは周囲骨折リスクが低下した（RR 0.55、p=0.04）。年齢・BMI・Charlson指数の調整後も関連は維持された。","clinicalImpact":"術前長期BP使用がTHA後の周囲骨折リスクを高める可能性があるという直感に反するデータ。日本では骨粗鬆症治療として長期BP投与患者も多く、THA術前評価においてBP使用歴を確認し、セメントレスよりもセメント固定ステムや骨内固定を確保しやすい設計（カラー付き）の選択を検討する根拠となる。","limitations":"請求データベース研究であり、BP処方の実際の服薬アドヒアランスは不明。骨粗鬆症の重症度（BMD値）が直接評価されていない。残余交絡（indication bias）を完全に排除できない。","relatedEvidence":"JBJS 2026年報告の大腿骨近位部骨折後TKAデータでも同様の「術前BP長期使用がPPFリスク増加」という傾向が示されており、関節形成術全般でのBP管理の再考を促すエビデンスが蓄積しつつある。"},"hi5":{"background":"THA後の周囲大腿骨骨折（PPF）は全THA再手術の25%を占める重大な合併症であり、その予防においてステム設計が重要な役割を果たすことが近年明らかになってきた。従来の「セメント vs セメントレス」という単純な二項対立から、「どのようなステム設計か」という議論へとシフトしつつある中、米国AJRRのリアルワールドデータが重要な知見を提供した。","methodology":"米国AJRR（American Joint Replacement Registry）の大規模多施設データを用いた後向きコホート研究として、一次THAにおける圧入型三重テーパーカラー付きセメントレスステム（TTW collared stem）と従来型セメントレスステム（タper型・カラーなし）の早期PPF率を比較した研究（JAAOS 2026年8月15日掲載）。","keyFindings":"モダンな三重テーパーカラー付きセメントレスステムが早期PPF率を従来型比3倍低下させた（1.2% vs 3.6%）。カラー（collar）の存在が近位大腿骨への応力分散を改善し、stress shieldingを低減することでPPF予防に寄与することが示された。セメント固定ステムとのPPF率比較でも遜色ない結果が得られた。","clinicalImpact":"日本でも高齢者THAの急増に伴いPPFが増加しているが、ステム設計の選択によってPPFリスクを大幅に低減できることが示された。特に骨粗鬆症合併高齢者・活動性の高い中高年患者へのTHAでは、三重テーパーカラー付きセメントレスステムの採用を積極的に検討することが支持される。","limitations":"レジストリデータは術者経験・患者選択バイアスを内包している。フォローアップ期間が比較的短く（平均3〜5年）、長期PPFリスクについては今後のデータ収集が必要。","relatedEvidence":"英国NHSデータ（Bone Joint J 2025年）の解析でも、カラー付きセメントレスステムがポリッシュテーパースリップ型セメントステムと同等かそれ以下のPPFリスクを示しており、本研究と整合する。"},"kn1":{"background":"内側区画型変形性膝関節症（OA）に対する外科的治療として、高位脛骨骨切り術（HTO）と内側単顆型人工膝関節置換術（UKA）は主要な選択肢であり、どちらを選択すべきかは長年の議論の的であった。HTOは生物学的治療で若年・高活動性患者に有利とされる一方、UKAは早期回復・低合併症率の優位性が主張されてきた。しかし大規模な比較データは限定的であった。","methodology":"UKAとHTOを比較した研究を対象としたランドマーク的メタ解析（39研究・56686例）。random-effectsモデルを用い、GRADE評価で証拠の質を判定した（Orthop Surg 2025年7月）。合併症率・TKA再置換率・術後疼痛・ROM・歩行速度・手術時間をアウトカムとして統合解析した。","keyFindings":"UKAはHTOと比較して全合併症率（RR=0.37、p<0.0001）・TKA再置換率（RR=0.64、p=0.05）・術後疼痛（MD=-0.33、p=0.03）のすべてで有意に優れた。ROM・歩行速度・手術時間には有意差なし。UKAの優位性は異なるサブグループ（年齢・BMI・側弯・追跡期間）でも一貫していた。","clinicalImpact":"56000例を超える最大規模のメタ解析として、UKAが内側区画型膝OAへの外科的治療として良好な選択肢であるというエビデンスが強化された。ただしHTOの軟骨保護効果（Ann Intern Med 2025年のMOWHTO RCTで2年間軟骨菲薄化を有意に抑制）も考慮すると、若年・高活動性・軽〜中等症OAではHTOが将来的なTKAを遅らせる戦略として依然価値がある。","limitations":"メタ解析の異質性が高い項目（ROM I²=98%）があり、統合結果の解釈に注意が必要。UKAとHTOの適応となる患者層が異なるため、直接比較の限界がある。施術者の習熟度が転帰に大きく影響する。","relatedEvidence":"NJR（英国）の大規模コホート研究でも、UKAはHTOより低い再置換率と患者満足度を示す傾向があるが、技術依存性が高くハイボリューム施設でのみ良好な転帰が維持されることが示されている。"},"kn2":{"background":"50歳未満の若年患者への膝関節置換術は、高い活動需要・長い余命から耐久性の問題が大きな課題となる。セメントレスTKAは骨内固定（osseointegration）による長期的な固定安定性が期待されるが、長期追跡データは極めて限定的であった。特に「30年生存するインプラント」が実現可能かどうかについての実臨床データはほぼ存在していなかった。","methodology":"単施設単術者の超長期後向きコホート研究として、50歳以下の患者75例（57患者）に対して解剖学的脛骨切除・骨スラリー適用を特徴とする独自のセメントレスTKAを施行し、平均30.3年（範囲25〜38年）追跡した（J Arthroplasty 2026年6月）。インプラント生存率・KSSスコア・再置換率・X線的評価を実施した。","keyFindings":"セメントレスTKAは30年という超長期にわたり優秀な生存率を示した。主要失敗原因はγ線照射ポリエチレンインサートの摩耗であり、骨内固定（osseointegration）自体の失敗・弛緩は少なかった。KSSは術前から術後まで有意に改善し維持された。γ線照射ポリエチレン使用例での摩耗率は現代の高架橋ポリエチレンの50倍以上とされており、現在のインプラントでは解決済みの問題である。","clinicalImpact":"現代の高架橋ポリエチレン（HXLPE）を使用したセメントレスTKAは、この研究で確認された骨内固定の長期耐久性と組み合わさることで、若年患者への生涯保証に近い耐久性が期待できる。日本でも50歳未満のTKA件数が増加しており、本データはセメントレス固定を積極的に選択する根拠となる。","limitations":"単施設・単術者の超高度専門化された結果であり、一般化には注意が必要。現在使用されるインプラントデザインとは異なる可能性があり、直接の外挿には限界がある。","relatedEvidence":"スウェーデン関節レジストリの大規模データでも、若年者（<55歳）のセメントレスTKAの再置換率はセメントTKAと同等かそれ以下であることが示されており、本長期データと整合する。"},"kn3":{"background":"変性内側半月板後根断裂（MMPRT）は中高年・肥満患者に多く認められる半月板の退行性変化であり、近年診断頻度が増加している。後根断裂により半月板の周方向張力（hoop stress）が失われ、内側コンパートメントへの力学的負荷が増大する。従来は関節鏡的半月板切除術が施行されることが多かったが、OA進行への影響については十分なデータがなかった。","methodology":"変性MMPRT 146例（切除群90・保存療法群56）を後向きに平均6.3年追跡した比較研究。VAS疼痛・IKDC・Tegner・Lysholmスコアとともに、KL分類によるOA進行度・HKAA（下肢アライメント）・内側関節裂隙幅を経時的に評価した。治療選択のバイアスを傾向スコア調整で補正した。","keyFindings":"臨床転帰（VAS・IKDC・Lysholm・Tegner）は切除群と保存療法群で最終追跡時に有意差なし。しかしKL分類によるOA進行は切除群で有意に高率（p=0.03）、内側関節裂隙幅の減少も切除群で有意に大きかった（p=0.04）。10年生存率（TKA回避率）は切除群87%・保存群88%で同等。","clinicalImpact":"関節鏡的半月板切除術が短期症状改善には有効であるものの、OA進行を加速させる可能性が示された。日本の変性MMPRT患者への治療において、まず保存療法（理学療法・体重管理・注射）を十分試みてから手術適応を検討することが支持される。特に「関節鏡で半月板を切れば楽になる」という安易な選択を再考すべきエビデンスとなる。","limitations":"後向き観察研究であり、切除の適応選択バイアスが存在する。追跡期間中に他の治療介入（注射・理学療法）が均一でない可能性がある。","relatedEvidence":"FIDELITY試験（NEJM 2013年→10年追跡 NEJM Evidence 2023年）が変性半月板切除の偽手術対照RCTで「切除の有効性なし」を示しており、本研究はその知見にOA進行という構造的害を追加するデータとして重要な補完的意義を持つ。"},"kn4":{"background":"ACL断裂に合併する外側半月板後根断裂（LMPRT）は近年その臨床的重要性が認識されるようになり、未修復のままACL再建術のみを施行した場合の残存不安定性・膝関節接触圧増大・将来的OA進行が懸念されてきた。しかしACLR同時LMPR修復が膝の安定性・機能転帰を改善するか、またはACLR単独と同等かについてのエビデンスは限定的であった。","methodology":"単施設後向きコホート研究として、2018〜2022年にACLR＋LMPR修復を施行した55歳未満患者（pullout修復またはinside-out修復）と傾向スコアマッチングした単独ACLR患者を比較した（J Exp Orthop 2026年4月）。最低2年追跡。AP・回旋安定性（KT-1000・ピボットシフト）・KOOS・MRIによる骨癒合評価を実施した。","keyFindings":"ACLR＋LMPR修復群はKT-1000前方移動量（1.8mm vs 2.2mm）・ピボットシフトグレード・KOOS各サブスケールで単独ACLR群と統計的に同等の良好な転帰を示した。MRIでは修復したLMPRの高い骨癒合率（92%）が確認された。LMPR断裂パターン（完全断裂 vs 不全断裂）による転帰差なし。合併症なし。","clinicalImpact":"ACL再建術において外側半月板後根を見落とさず同時修復することが、膝の安定性を維持しながら可能であることが示された。日本でも関節鏡によるACLRの際に後外側コンパートメントを積極的に評価し、LMPRTを発見した場合に同時修復を行う体制の整備が必要とされる。","limitations":"単施設後向き研究で選択バイアスが存在する。術者の経験（LMPR修復の習熟度）が転帰に影響する。長期（5年以上）での外側OA進行・再断裂率は未評価。","relatedEvidence":"ノルウェー膝靭帯レジストリ（OJSM 2025年）の解析でもACLRへのLMPR修復追加率が2018〜2023年で有意に増加しており、認知度と実践の両面での進歩が示されている。"},"kn5":{"background":"変形性関節症（OA）は世界で最も多い関節疾患であり、現在disease-modifying（疾患修飾的）薬物療法が存在しない。その病態生理の解明と治療法開発を目指した遺伝学的アプローチとして、過去最大規模のゲノムワイド関連解析（GWAS）がHelmholtz Munich主導の国際コンソーシアムにより実施された。196万人という前例のない規模のデータが新たな治療標的の同定と既承認薬の再目的化の可能性を開いた。","methodology":"PRISMA準拠のGWASメタ解析として、489975例（OA患者）と1472094例（対照）の遺伝子配列を比較した（Nature 2025年4月）。脊椎・手指・股関節・膝を含む複数関節部位別のOAを解析対象とした。単細胞マルチオミクスデータ・トランスクリプトーム・プロテオーム・エピゲノムデータを統合した機能解析も実施した。","keyFindings":"962の独立した遺伝的関連（うち513が新規）を確立。700のエフェクター遺伝子を同定。うち69遺伝子の蛋白産物はすでに473種の承認薬（がん・自己免疫疾患・代謝疾患など）の標的となっており、drug repurposing候補として浮上した。8つの生物学的プロセス（サーカディアンリズム・TGFβ・FGF・WNT・グリア細胞・ECM組織化など）が関与。脊椎OAへの4シグナルを含む複数部位特異的シグナルも同定された。","clinicalImpact":"OAは「年齢とともに進行する摩耗性疾患」という従来概念から、遺伝・生物学的プロセスが駆動する全身性疾患へと再定義されつつある。整形外科医にとっては、患者の遺伝的リスク評価や個別化医療の可能性という新たな視点が加わった。特にFGF・WNT経路阻害薬のOAへの転用臨床試験が複数進行中であり、2030年代の疾患修飾薬実現への期待が高まっている。","limitations":"GWASは相関を示すものであり、因果関係の証明には機能実験が必要。発見されたバリアントの多くは効果量が小さく（OR 1.016〜1.186）、臨床予測への個別利用は限定的。多様な民族背景のデータ拡充が必要。","relatedEvidence":"同年発表のMillion Veteran Program（Nature Genetics）での多民族GWASと結果が部分的に重複しており、発見の再現性が確認されている。"},"tr1":{"background":"転位性関節内踵骨骨折（Sanders II〜IV型）はORIF後の長期合併症として距骨下関節変形性関節症（OA）が30〜60%に発生し、その場合は二期的距骨下関節固定術（STF）が必要となる。一期的ORIF＋STFは二次手術の回避という観点から魅力的だが、合併症・固定率・機能転帰についての大規模なエビデンスは限定的であった。","methodology":"サイナスタルジアアプローチを用いたORIF＋一期的距骨下関節固定術（PSA）を施行した64例（62患者、平均年齢47歳）を後向きに評価した研究（Bone Joint J 2026年3月）。適応基準：Sanders III〜IV・高度粉砕・後部関節面の重篤な軟骨損傷。主要転帰は骨癒合率・合併症率・機能スコア（AOFAS・SF-36）・QOL（EQ-5D）。平均追跡30ヶ月。","keyFindings":"距骨下関節癒合率98%（63/64例）。AOFAS・SF-36・EQ-5Dはすべて術前と比較して有意に改善。ORIF単独（歴史的対照）と比較して機能転帰は同等以上。主要合併症（創傷感染・骨髄炎）率は6%でORIF単独と同等であった。二次手術（STF）の必要性を回避できた。","clinicalImpact":"事前定義した患者選択基準（Sanders III〜IV・高度粉砕）を満たす症例では、一期的ORIF＋PSAが二次手術リスクを回避しながら良好な機能転帰をもたらす現実的な選択肢となる。日本でも交通事故・高所転落による高エネルギー踵骨骨折への標準化されたアプローチとして普及が期待される。","limitations":"後向き研究であり選択バイアスが存在する。サイナスタルジアアプローチに習熟した術者による結果であり、一般化可能性には制限がある。追跡期間が平均30ヶ月と中期であり、長期での距骨下関節の経過は不明。","relatedEvidence":"JBJS 2020年のRCT（ORIF vs 一期的STF、25例）でも機能転帰の同等性が示されており、本後向き研究の結果を支持する。Sanders IV型骨折での一期的PSAの優位性を支持するエビデンスが蓄積しつつある。"},"tr2":{"background":"開放性脛骨骨折（特にGustilo-Anderson II〜III型）は感染性偽関節（FRI）が最重要合併症の一つであり、発生率は5〜30%に達する。全身投与抗菌薬に加えて局所抗菌薬投与が感染率低減に有効とされてきたが、局所投与の最適な形態（ビーズ・スポンジ・コーティングインプラント）については議論があった。GCN（ゲンタマイシンコーティング髄内釘）はインプラント自体に抗菌薬を組み込んだ革新的アプローチとして期待されていた。","methodology":"単施設前向きコホート研究として、開放性脛骨骨折139例（GA分類II型42例・IIIa型58例・IIIb型39例）に対してGCNを標準プロトコール下で使用し最低24ヶ月追跡した（Antibiotics 2025年5月）。主要転帰は術後FRI発生率（ICMコンセンサス基準）。骨癒合率・再手術率も評価した。","keyFindings":"全体のFRI発生率は2.88%（4/139例）と低率であり、過去の非コーティング釘使用例（文献値5〜15%）と比較して有意に低下した。GA分類別では差なし。2年追跡でも効果の持続が確認された。骨癒合への悪影響なし（骨癒合率96%）。コーティング由来の全身毒性なし。","clinicalImpact":"局所抗菌薬含浸髄内釘は開放性脛骨骨折管理における感染予防の新たな標準となりうる。日本の外傷センターでも採用の検討が進むと思われるが、コスト・薬事承認状況の確認が実装の前提となる。抗菌薬コーティングの有効成分（ゲンタマイシン vs バンコマイシン）・コーティング方法（リン酸カルシウム系 vs ポリマー系）の最適化については引き続き研究が必要。","limitations":"単施設研究でサンプルサイズが限定的。非コーティング釘との直接RCT比較ではなく、歴史的対照との比較である。長期（5年以上）での感染制御率・インプラント摩耗・骨代謝への影響は未評価。","relatedEvidence":"CERAMENT G（ゲンタマイシン溶出型骨セメント）を用いたGA IIIb型開放骨折管理（10年追跡、J Orthop 2025年）でも四肢温存率97.1%という良好な成績が示されており、局所抗菌薬の有効性を支持する。"},"tr3":{"background":"上腕骨近位端骨折は高齢者（60歳以上）で最も多い骨折の一つであり、その多くが保存療法で管理されてきた。しかし一方で「転位が大きければ手術すべき」という積極的手術派の主張も根強く、世界各地で手術率が上昇してきた。保存療法後の「手術移行率」という指標は、保存療法の「リスク」を定量的に示す重要なデータであり、特に患者インフォームドコンセントに有用とされていた。","methodology":"スウェーデン骨折レジストリ（SFR）の2013〜2021年データを用いた大規模後向きコホート研究。18歳以上の上腕骨近位端骨折31761例（平均年齢70歳、女性76%）を対象に、保存療法後1年以内の手術移行率を骨折分類（AO/OTA）・年齢層別に分析した（JBJS What's New in Orthopaedic Trauma 2026年7月掲載）。","keyFindings":"保存療法後の手術移行率は全体3.7%と低率。80歳以上かつ単純骨折型（A1・A2・B1）では移行率2%未満。一方、若年（<60歳）・C型骨折・骨折脱臼では移行率5〜20%と有意に高かった。最多の移行理由は整復位喪失・骨不癒合・遷延性疼痛であった。","clinicalImpact":"高齢者の単純型上腕骨近位端骨折に対して「保存療法を試みて失敗すれば手術」というストラテジーが、3.7%という低い移行率から安全に実践できることが世界最大規模のレジストリデータで確認された。日本でも手術率の上昇傾向があるが、本データは高齢者への不要な手術介入を避ける根拠となる。","limitations":"レジストリデータであり、患者報告アウトカム（疼痛・機能）は評価されていない。手術移行の判断基準が施設・術者により異なる可能性がある。スウェーデンの医療システム・患者活動レベルへの依存があり、日本との直接比較には注意が必要。","relatedEvidence":"英国NJRデータ（Shoulder & Elbow 2024年）の60歳以上PHF患者分析でも、初期保存療法群の手術移行率は4.1%と同様の低率が示されており、本研究の知見を支持する。"},"tr4":{"background":"大腿骨骨幹部骨折（OTA/AO 32型）に対する髄内釘（IMN）は現在の標準治療として確立されているが、拡髄（リーミング）の実施有無については長年議論が続いてきた。拡髄により骨癒合が促進されるという理論的根拠（骨髄細胞・成長因子の放出・血液供給の改善）がある一方、脂肪塞栓・肺障害のリスクが懸念されてきた。特に多発外傷や開放骨折での適用については慎重意見もあった。","methodology":"大腿骨骨幹部骨折への拡髄髄内釘（RIN）と非拡髄髄内釘（URIN）を比較した前向きRCTのみを対象としたメタ解析（8RCT、Medicine誌掲載）。主要転帰は骨癒合期間・骨不癒合率・二次手術率。副次転帰にインプラント破損率・ARDS発生率・死亡率を含む。random-effectsモデルで統合解析した。","keyFindings":"RINはURINと比較して骨癒合期間が有意に短く（SMD=-0.62、p<0.0001）、二次手術率が有意に低く（OR=0.25、95%CI 0.10〜0.60、p=0.003）、骨不癒合率も有意に低かった（OR=0.14、95%CI 0.04〜0.49、p<0.001）。インプラント破損率・ARDS発生率・死亡率には有意差なし。","clinicalImpact":"閉鎖性大腿骨骨幹部骨折への拡髄髄内釘が標準治療として確立されたというエビデンスがさらに強固になった。拡髄によるARDS・脂肪塞栓のリスクは現代の適切な拡髄速度・段階的リーミングの管理により許容範囲内であることが示された。日本の外傷センターでも拡髄のルーチン実施を標準化することが骨不癒合・再手術を減らす合理的な方向性といえる。","limitations":"8件のRCTのみが対象で、各試験の患者背景・骨折分類・リーミングプロトコルに不均一性がある。多発外傷・開放骨折のサブグループ解析は不十分。","relatedEvidence":"SPRINT試験（NEJM 2015年）でも拡髄が大腿骨骨幹部骨折の骨癒合率向上に有効であることが示されており、本メタ解析の結論と整合する。"},"tr5":{"background":"足関節脱臼骨折に合併する下脛腓関節離開（シンデスモーシス損傷）の固定において、スーチャーボタン（SB）がシンデスモーシスネジ（SS）に取って代わりつつある。SBは弾性的固定により正常なシンデスモーシスの生理的運動を許容するという理論的優位性があり、機能スコアでSSを上回る研究が多数報告されてきた。しかし「統計的有意差」と「臨床的意義」の乖離という問題が本アンブレラレビューによって明らかにされた。","methodology":"SB vs SS比較の系統的レビュー・メタ解析を対象としたアンブレラレビュー（19件）として、各メタ解析から報告されたAOFAS・OMASのWMD（加重平均差）を抽出し、確立されたMCID（Minimal Clinically Important Difference：最小臨床的重要差）と照合した（Injury 2026年1月）。MCIDはOMAS 7.5〜11.4点・AOFAS 4.1〜7.8点を採用した。","keyFindings":"19件の系統的レビューのうち大多数がSBのAOFAS・OMASスコア優位性を報告していたが、OMASでは11件・AOFASでは12件のレビューでその差がMCID閾値を超えなかった。整復精度（malreduction率）はSBが有意に低く（SS 12% vs SB 1%）、SBの構造的優位性は示された。ネジの「ルーチン抜釘不要」という現在のコンセンサスを踏まえると、SS残存例でのQOL差は一層小さくなる。","clinicalImpact":"日本でもSSからSBへの移行が進んでいるが、機能的優位性の実際の臨床的意義には疑問が呈された。整復精度・再手術リスクではSBが優れるが、ルーチン抜釘を行わないSSとの長期比較では差がさらに縮小する可能性がある。コスト・整復精度・患者活動性を統合した個別化選択が現時点では合理的な対応である。","limitations":"アンブレラレビューは元の研究の質・バイアスを受け継ぐ。MCIDの閾値値は研究間で異なり、採用値の選択が結論に影響する。抜釘を行った群と非抜釘群が混在しており、純粋な比較に限界がある。","relatedEvidence":"RODEO試験（Bone & Joint 2021年→4年追跡 2023年）では「ルーチン抜釘 vs 症状時抜釘」の機能転帰に差がないことが確認されており、SSの「抜釘が必要」という最大のデメリットが事実上解消されたことが本アンブレラレビューの文脈でも重要な背景となっている。"}};

let favorites = new Set();

/* ──── テーマ ──── */
function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  currentThemeId = t.id;
  const r = document.documentElement;
  r.style.setProperty("--accent",t.accent); r.style.setProperty("--accent-bg",t.accentBg);
  r.style.setProperty("--accent-text",t.accentText); r.style.setProperty("--bg",t.bg);
  r.style.setProperty("--surface",t.surface); r.style.setProperty("--text-primary",t.textPrimary);
  r.style.setProperty("--text-secondary",t.textSecondary); r.style.setProperty("--border",t.border);
  localStorage.setItem("ortho_theme", id);
  renderSwatches();
}
function renderSwatches(){
  document.getElementById("swatches").innerHTML = THEMES.map(t=>`
    <div style="text-align:center">
      <div class="swatch${t.id===currentThemeId?" active":""}" style="background:${t.color}"
        onclick="applyTheme('${t.id}')" role="button" aria-label="${t.name}">
        ${t.id===currentThemeId?'<i class="ti ti-check" style="color:#fff;font-size:16px"></i>':""}
      </div>
      <div class="swatch-name">${t.name}</div>
    </div>`).join("");
}
function openTheme(){ renderSwatches(); document.getElementById("themeOverlay").classList.add("open"); }
function closeTheme(){ document.getElementById("themeOverlay").classList.remove("open"); }

  document.getElementById("geminiKeyInput").value = key;
  document.getElementById("keyStatus").textContent = key ? "✅ APIキーが保存されています" : "";

  else { localStorage.removeItem("ortho_gemini_key"); }
  document.getElementById("keyStatus").textContent = v ? "✅ 保存しました" : "";

}
function clearKey(){
  localStorage.removeItem("ortho_gemini_key");
  document.getElementById("geminiKeyInput").value = "";

}

/* ──── データ読込 ──── */
async function loadAll(){
  await Promise.all([loadPapers(), loadImplants(), loadDetails()]);
}
async function loadPapers(){
  try{
    const r = await fetch("news.json?t="+Date.now());
    if(!r.ok) return;
    const d = await r.json();
    if(d && d.papers && d.papers.length){ newsPapers = d.papers; papersUpdated = d.updated||""; }
  }catch(e){}
}
async function loadImplants(){
  try{
    const r = await fetch("implant_news.json?t="+Date.now());
    if(!r.ok){ console.warn("implant_news.json:",r.status); return; }
    const d = await r.json();
    if(d && d.companies && d.companies.length){ implantData = d; implantsUpdated = d.updated||""; }
  }catch(e){ console.warn("implant fetch error:",e); }
}
async function loadDetails(){
  try{
    const r = await fetch("details.json?t="+Date.now());
    if(!r.ok){ detailsData = {...BASE_DETAILS, ...localDetails}; return; }
    const d = await r.json();
    if(d) detailsData = {...BASE_DETAILS, ...d, ...localDetails};
    else   detailsData = {...BASE_DETAILS, ...localDetails};
  }catch(e){ detailsData = {...BASE_DETAILS, ...localDetails}; }
}

/* ──── 詳細解析をAPIで生成 ──── */
async function fetchDetailFromApi(paper){
  const key = localStorage.getItem("ortho_gemini_key");
  if(!key) return null;
  const model = localStorage.getItem("ortho_gemini_model") || "gemini-flash-latest";
  const prompt = `整形外科医向けに以下の論文の詳細解説をJSON形式のみで返してください。論文: ${paper.title} (${paper.journal||""}) フィールド: background, methodology, keyFindings, clinicalImpact, limitations, relatedEvidence（各2〜3文）。JSONのみ。`;
  try{
    const r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}]})}
    );
    if(!r.ok) return null;
    const data = await r.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text||"";
    const m = text.match(/\{[\s\S]*\}/);
    return m ? JSON.parse(m[0]) : null;
  }catch(e){ return null; }
}

/* ──── Gemini手動取得 ──── */
async function fetchManual(){
  const key = localStorage.getItem("ortho_gemini_key");
  if(!key) return null;

  const today = new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});
  const prompt = `整形外科の最新論文4件をJSON配列で返してください。各フィールド: specialty(脊椎/肩/股関節/膝/外傷/肘/手指のいずれか), title(日本語), journal(雑誌名と年月), overview(1〜2文), results(1〜2文), conclusion(1〜2文)。JSONのみ。前置き不要。`;

  const body = JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}]});

  // 保存済みモデルを使う、なければ一覧から取得
  let model = localStorage.getItem("ortho_gemini_model") || "";
  if(!model){
    for(const ver of ["v1beta","v1"]){
      try{
        const r = await fetch(`https://generativelanguage.googleapis.com/${ver}/models?key=${key}`);
        if(r.ok){
          const d = await r.json();
          const all = (d.models||[]).map(m=>m.name.replace("models/",""));
          const flash = all.filter(n=>n.includes("flash"));
          model = flash[0] || all[0] || "";
          if(model){ localStorage.setItem("ortho_gemini_model", model); break; }
        }
      }catch(e){}
    }
  }
  if(!model) throw new Error("利用可能なモデルが見つかりませんでした。⚙設定の「接続テスト」を実行してください。");

  let r;
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 30000); // 30秒タイムアウト
    r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
      {method:"POST", headers:{"Content-Type":"application/json"}, body, signal:ctrl.signal}
    );
    clearTimeout(timer);
  }catch(e){
    if(e.name==="AbortError") throw new Error("タイムアウト（30秒）。再試行してください。");
    throw new Error("ネットワークエラー: "+e.message);
  }

  if(!r.ok){
    let msg = "エラー "+r.status;
    try{ const e=await r.json(); msg=e.error?.message||msg; }catch(ex){}
    // 混雑・過負荷・モデル未対応 → 全モデルを順番に試す
    if(r.status===503 || r.status===429 || r.status===404 || msg.includes("high demand") || msg.includes("overloaded") || msg.includes("invalid argument")){
      localStorage.removeItem("ortho_gemini_model");
      // 利用可能なモデル一覧を取得して全部試す
      let allModels = [];
      try{
        const lr=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        if(lr.ok){ const ld=await lr.json(); allModels=(ld.models||[]).map(m=>m.name.replace("models/","")); }
      }catch(ex){}
      if(!allModels.length) allModels=["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-2.5-pro","gemini-pro-latest","gemini-flash-lite-latest"];
      for(const fb of allModels){
        if(fb===model) continue; // 既に失敗したモデルはスキップ
        if(fb.includes("tts")||fb.includes("embed")) continue; // 音声・埋め込み系はスキップ
        try{
          const ctrl2=new AbortController();
          const t2=setTimeout(()=>ctrl2.abort(),30000);
          const r2=await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${fb}:generateContent?key=${key}`,
            {method:"POST",headers:{"Content-Type":"application/json"},body,signal:ctrl2.signal}
          );
          clearTimeout(t2);
          if(r2.ok){
            localStorage.setItem("ortho_gemini_model",fb);
            const data2=await r2.json();
            const text2=data2.candidates?.[0]?.content?.parts?.[0]?.text||"";
            const m2=text2.match(/\[[\s\S]*\]/);
            if(m2){
              const ts=Date.now();
              return JSON.parse(m2[0]).map((p,i)=>({...p,id:`manual_${ts}_${i}`,isNew:true}));
            }
          }
        }catch(ex){}
      }
      throw new Error("すべてのモデルが混雑中です。数分後に再試行してください。");
    }
    if(r.status===403) throw new Error("アクセス拒否（403）。APIキーまたはGenerative Language APIの有効化を確認してください。");
    throw new Error(msg);
  }
}

/* ──── 論文リスト ──── */
function allPapers(){
  const all = [...manualPapers, ...newsPapers, ...BASE_PAPERS];
  const seen = new Set();
  return all.filter(p=>{ if(seen.has(p.id)) return false; seen.add(p.id); return true; });
}
function filteredPapers(){
  const all = allPapers();
  let f;
  if(currentSp==="すべて")         f = all;
  else if(currentSp==="お気に入り") f = all.filter(p=>favorites.has(p.id));
  else                              f = all.filter(p=>p.specialty===currentSp);
  return [...f.filter(p=>p.isNew), ...f.filter(p=>!p.isNew)];
}

/* ──── お気に入り ──── */
function toggleFav(id, e){
  e.stopPropagation();
  favorites.has(id) ? favorites.delete(id) : favorites.add(id);
  saveFavorites();
  const on = favorites.has(id);
  const hbtn = document.getElementById("fav-h-"+id);
  if(hbtn){ hbtn.innerHTML=`<i class="ti ${on?"ti-heart-filled":"ti-heart"}"></i>`; hbtn.style.color=on?"#e11d48":"var(--text-muted)"; }
  const fbtn = document.getElementById("fav-b-"+id);
  if(fbtn){ fbtn.className="fav-btn"+(on?" on":""); fbtn.innerHTML=`<i class="ti ${on?"ti-heart-filled":"ti-heart"}"></i>${on?"お気に入り解除":"お気に入りに追加"}`; }
  if(currentSp==="お気に入り") renderPapers();
  else renderSubtabs();
}

/* ──── 詳細解析 ──── */
function toggleDetail(id){
  const panel = document.getElementById("dp-"+id);
  const btn = document.getElementById("db-"+id);
  if(!panel) return;
  if(detailShown.has(id)){
    panel.style.display="none"; detailShown.delete(id);
    if(btn) btn.innerHTML='<i class="ti ti-microscope"></i>詳しく読む';
    return;
  }
  const d = detailsData[id];
  if(d){
    panel.innerHTML = '<div class="detail-panel-header"><i class="ti ti-microscope"></i>詳細解析</div>' +
      [["background","研究背景・臨床的課題"],["methodology","研究デザイン・方法の詳細"],
       ["keyFindings","主要な発見・数値の詳細"],["clinicalImpact","日本の臨床現場へのインパクト"],
       ["limitations","研究の限界・課題"],["relatedEvidence","関連エビデンスとの比較"]
      ].filter(s=>d[s[0]]).map(s=>`<div class="detail-section"><div class="detail-section-label">${s[1]}</div><div class="detail-section-text">${d[s[0]]}</div></div>`).join("");
    panel.style.display="";
    detailShown.add(id);
    if(btn) btn.innerHTML='<i class="ti ti-chevron-up"></i>詳細を閉じる';
  } else {
    panel.innerHTML='<div class="detail-loading"><i class="ti ti-clock"></i>詳細は毎日 6:00 の自動更新時に生成されます</div>';
    panel.style.display="";
  }
}

/* ──── レンダリング ──── */
function updateBadge(){
  const upd = currentMode==="papers" ? papersUpdated : implantsUpdated;
  document.getElementById("updateBadge").textContent = upd ? upd+"更新" : "";
}
function renderSubtabs(){
  const all = allPapers();
  document.getElementById("subtabs").innerHTML = SPECIALTIES.map(s=>{
    let cnt = s==="すべて" ? all.length : s==="お気に入り" ? favorites.size : all.filter(p=>p.specialty===s).length;
    const active = s===currentSp;
    const isFav = s==="お気に入り";
    const sp = SP_STYLE[s]||{};
    const style = isFav
      ? (active?"border-color:#e11d48;background:#fff1f2;color:#e11d48;":"border-color:#fecdd3;color:#e11d48;")
      : (active && sp.text ? `border-color:${sp.text};background:${sp.bg};color:${sp.text};` : "");
    const icon = isFav
      ? `<i class="ti ti-heart-filled" style="font-size:11px"></i>`
      : (SP_ICONS[s]||"");
    return `<button class="stab${active?" active":""}" onclick="selectSp('${s}')" style="${style}">${icon}${s} <small style="opacity:.7">${cnt}</small></button>`;
  }).join("");
}
function renderPapers(){
  const list = filteredPapers();
  const nc = list.filter(p=>p.isNew).length;
  document.getElementById("countLabel").textContent = list.length+"件";
  const sl = document.getElementById("subLabel");
  sl.textContent = nc>0 ? "うち新着 "+nc+"件" : "";
  sl.style.color = "#059669";
  if(!list.length){ document.getElementById("content").innerHTML='<div class="empty">この分野の論文はありません</div>'; return; }
  let html = '<div class="paper-list">';
  let shownNew=false, shownOld=false;
  list.forEach(p=>{
    const sp = SP_STYLE[p.specialty]||{bg:"#F8FAFC",text:"#475569"};
    const exp = expandedId===p.id;
    const on = favorites.has(p.id);
    const dShown = detailShown.has(p.id);
    if(p.isNew && !shownNew){ html+=`<div class="new-divider"><i class="ti ti-sparkles"></i>今週の新着</div>`; shownNew=true; }
    if(!p.isNew && !shownOld && nc>0){ html+=`<div class="old-divider">アーカイブ</div>`; shownOld=true; }
    html += `<article class="card">
      <div class="card-header" onclick="togglePaper('${p.id}')">
        <div class="card-meta">
          <div class="badges">
            <span class="badge" style="background:${sp.bg};color:${sp.text}">${SP_ICONS[p.specialty]||""}${p.specialty}</span>
            ${p.isNew?'<span class="badge" style="background:#ECFDF5;color:#065F46">新着</span>':""}
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button id="fav-h-${p.id}" onclick="toggleFav('${p.id}',event)"
              style="background:none;border:none;cursor:pointer;padding:2px;font-size:18px;color:${on?"#e11d48":"var(--text-muted)"}" aria-label="お気に入り">
              <i class="ti ${on?"ti-heart-filled":"ti-heart"}"></i>
            </button>
            <i class="ti ${exp?"ti-chevron-up":"ti-chevron-down"}" style="font-size:15px;color:var(--text-muted)"></i>
          </div>
        </div>
        <p class="card-title">${p.title}</p>
        <p class="card-journal">${p.journal}</p>
      </div>
      ${exp ? `<div class="card-body">
        <div><div class="section-label">概要</div><div class="section-text">${p.overview}</div></div>
        <div><div class="section-label">結果</div><div class="section-text">${p.results}</div></div>
        <div><div class="section-label">結論・考察</div><div class="section-text">${p.conclusion}</div></div>
        <div class="card-actions">
          <button class="detail-btn" id="db-${p.id}" onclick="toggleDetail('${p.id}')">
            <i class="ti ${dShown?"ti-chevron-up":"ti-microscope"}"></i>${dShown?"詳細を閉じる":"詳しく読む"}
          </button>
          <button class="fav-btn${on?" on":""}" id="fav-b-${p.id}" onclick="toggleFav('${p.id}',event)">
            <i class="ti ${on?"ti-heart-filled":"ti-heart"}"></i>${on?"お気に入り解除":"お気に入りに追加"}
          </button>
        </div>
        <div id="dp-${p.id}" class="detail-panel" style="${dShown?"":"display:none"}"></div>
      </div>` : ""}
    </article>`;
  });
  html += '</div>';
  document.getElementById("content").innerHTML = html;
  // 開いているカードの詳細を復元
  detailShown.forEach(id=>{
    const panel = document.getElementById("dp-"+id);
    const btn = document.getElementById("db-"+id);
    if(!panel) return;
    const d = detailsData[id];
    if(d){
      panel.innerHTML = '<div class="detail-panel-header"><i class="ti ti-microscope"></i>詳細解析</div>' +
        [["background","研究背景・臨床的課題"],["methodology","研究デザイン・方法の詳細"],
         ["keyFindings","主要な発見・数値の詳細"],["clinicalImpact","日本の臨床現場へのインパクト"],
         ["limitations","研究の限界・課題"],["relatedEvidence","関連エビデンスとの比較"]
        ].filter(s=>d[s[0]]).map(s=>`<div class="detail-section"><div class="detail-section-label">${s[1]}</div><div class="detail-section-text">${d[s[0]]}</div></div>`).join("");
      panel.style.display="";
      if(btn) btn.innerHTML='<i class="ti ti-chevron-up"></i>詳細を閉じる';
    }
  });
}
function renderImplants(){
  document.getElementById("countLabel").textContent="";
  document.getElementById("subLabel").textContent="";
  if(!implantData){
    document.getElementById("content").innerHTML=`<div class="empty">
      <i class="ti ti-alert-circle" style="font-size:36px;display:block;margin-bottom:12px"></i>
      インプラントニュースを読み込めませんでした<br>
      <small>implant_news.json がリポジトリに存在するか確認してください</small><br><br>
      <button onclick="retryImplants()" class="btn">再試行</button></div>`;
    return;
  }
  const companies = implantData.companies||[];
  const active = companies.filter(c=>c.rating>0).length;
  document.getElementById("countLabel").textContent = companies.length+"社";
  const sl = document.getElementById("subLabel");
  sl.textContent = active+"社に動きあり";
  sl.style.color = active>0 ? "#92400E" : "var(--text-muted)";
  const sorted = [...companies].sort((a,b)=>(b.rating||0)-(a.rating||0));
  document.getElementById("content").innerHTML = '<div class="implant-list">'+sorted.map(c=>{
    const r = c.rating||0;
    const rc = RATING_COLORS[r]||RATING_COLORS[0];
    const stars = "★".repeat(r)+"☆".repeat(3-r);
    const items = c.items||[];
    return `<div class="implant-card">
      <div class="implant-header"><span class="implant-name">${c.company}</span><span class="stars" style="color:${rc.text}">${stars}</span></div>
      ${items.length?`<div class="implant-items">${items.map(item=>{
        const cs=CAT_STYLE[item.category]||CAT_STYLE["その他"];
        return `<div class="implant-item"><div class="implant-item-head"><span class="cat-badge" style="background:${cs.bg};color:${cs.text}">${item.category}</span><span class="implant-item-title">${item.title}</span></div><p class="implant-item-summary">${item.summary}</p></div>`;
      }).join("")}</div>`:`<p class="no-news">今週は特筆すべき動きなし</p>`}
    </div>`;
  }).join("")+'</div>';
}
async function retryImplants(){
  showNotice("loading","再読み込み中...");
  await loadImplants();
  document.getElementById("noticeBar").style.display="none";
  renderImplants();
}
function render(){
  updateBadge();
  if(currentMode==="papers"){
    document.getElementById("subtabsWrap").style.display="";
    renderSubtabs(); renderPapers();
  } else {
    document.getElementById("subtabsWrap").style.display="none";
    renderImplants();
  }
}
async function setMode(mode){
  currentMode = mode; expandedId = null;
  document.getElementById("btnPapers").classList.toggle("active", mode==="papers");
  document.getElementById("btnImplants").classList.toggle("active", mode==="implants");
  if(mode==="implants" && !implantData){
    showNotice("loading","インプラントニュースを読み込み中...");
    await loadImplants();
    document.getElementById("noticeBar").style.display="none";
  }
  render();
}
function selectSp(sp){ currentSp=sp; expandedId=null; renderSubtabs(); renderPapers(); }
function togglePaper(id){ expandedId = expandedId===id ? null : id; renderPapers(); }

/* ──── 通知 ──── */
let noticeTimer = null;
function showNotice(type, msg, autoHide){
  const bar=document.getElementById("noticeBar");
  const s={loading:{bg:"#EFF6FF",color:"#1E40AF",icon:"ti-loader spin"},success:{bg:"#ECFDF5",color:"#065F46",icon:"ti-check"},error:{bg:"#FEF2F2",color:"#991B1B",icon:"ti-alert-circle"}}[type];
  bar.style.cssText=`display:flex;background:${s.bg};color:${s.color};`;
  document.getElementById("noticeIcon").className="ti "+s.icon;
  document.getElementById("noticeText").textContent=msg;
  if(noticeTimer) clearTimeout(noticeTimer);
  if(autoHide) noticeTimer=setTimeout(()=>{ bar.style.display="none"; }, autoHide);
}

/* ──── 最新情報を読込 ──── */
async function testApi(){
  const key = document.getElementById("geminiKeyInput").value.trim()
              || localStorage.getItem("ortho_gemini_key") || "";
  const res = document.getElementById("testResult");
  res.style.display="block";
  res.style.background="var(--accent-bg)";
  res.textContent="モデル一覧を取得中...";
  if(!key){ res.textContent="❌ APIキーが未入力です"; res.style.background="var(--danger-bg)"; return; }

  // モデル一覧を取得
  let availableModels = [];
  for(const ver of ["v1beta","v1"]){
    try{
      const r = await fetch(`https://generativelanguage.googleapis.com/${ver}/models?key=${key}`);
      if(r.ok){
        const d = await r.json();
        availableModels = (d.models||[]).map(m=>m.name.replace("models/",""));
        break;
      }
    }catch(e){}
  }

  if(availableModels.length === 0){
    res.style.background="var(--danger-bg)";
    res.innerHTML="❌ モデル一覧を取得できませんでした。APIキーを確認してください。";
    return;
  }

  // flash系 → pro系 → その他の順で試す
  const flash = availableModels.filter(n=>n.includes("flash"));
  const ordered = [...flash, ...availableModels.filter(n=>!n.includes("flash"))];
  const results = [];

  for(const model of ordered.slice(0, 6)){
    try{
      const r = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
        {method:"POST", headers:{"Content-Type":"application/json"},
         body:JSON.stringify({contents:[{role:"user",parts:[{text:"hello"}]}]})}
      );
      results.push(`${model}: ${r.status}`);
      if(r.ok){
        localStorage.setItem("ortho_gemini_model", model);
        res.style.background="var(--success-bg)";
        res.textContent="✅ 成功！ 使用モデル: "+model;
        return;
      }
      if(r.status===400){
        // 400はキー有効・モデル有効だがリクエスト形式問題の可能性
        try{
          const e = await r.json();
          results[results.length-1] += " ("+(e.error?.message||"").slice(0,50)+")";
        }catch(ex){}
      }
    }catch(e){ results.push(`${model}: ネットワークエラー`); }
  }

  res.style.background="var(--danger-bg)";
  res.innerHTML="各モデルの結果:<br><b>"+results.join("<br>")+"</b>";
}

async function reloadAll(){
  const btn = document.getElementById("fetchBtn");
  btn.disabled = true;
  const hasKey = !!localStorage.getItem("ortho_gemini_key");
  btn.innerHTML = `<i class="ti ti-loader spin"></i>${hasKey?"論文を取得中...":"読込中..."}`;
  if(hasKey){
    showNotice("loading","Gemini API で新しい論文を取得中...");
    try{
      const papers = await fetchManual();
      if(papers && papers.length){
        manualPapers = [...papers, ...manualPapers];
        saveManualPapers();
        // 取得した論文の詳細解析も生成
        showNotice("loading","詳細解析を生成中...");
        for(const p of papers){
          try{
            const detail = await fetchDetailFromApi(p);
            if(detail){ localDetails[p.id] = detail; }
          }catch(ex){}
        }
        saveLocalDetails();
        showNotice("success", papers.length+"件の新着論文を取得しました（詳細解析含む）", 3000);
      }
    } catch(e){
      showNotice("error","取得に失敗しました："+e.message, 4000);
    }
  } else {
    showNotice("loading","最新情報を取得中...");
  }
  await loadAll();
  render();
  if(!hasKey) showNotice("success","最新情報を読み込みました", 3000);
  btn.disabled=false;
  btn.innerHTML='<i class="ti ti-refresh"></i>最新情報を読込';
}

/* ──── 初期化 ──── */
(async ()=>{
  loadFavorites();
  loadManualPapers();
  loadLocalDetails();
  applyTheme(localStorage.getItem("ortho_theme")||"blue");
  showNotice("loading","データを読み込み中...");
  await loadAll();
  document.getElementById("noticeBar").style.display="none";
  render();
})();
