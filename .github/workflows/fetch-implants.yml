yaml
name: 国内インプラントメーカーニュース取得（毎週月曜）

on:
  schedule:
    - cron: '30 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-implants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-generativeai
      - env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python fetch_implant_news.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add implant_news.json
          git diff --staged --quiet || git commit -m "🏭 インプラントニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          git push
