name: 整形外科論文ニュース取得（毎日・PubMed連携）

on:
  schedule:
    - cron: '0 21 * * *'   # 21:00 UTC = 翌朝 6:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-papers
  cancel-in-progress: false

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ① 生成の前に必ずリモート最新へ同期する（push競合の根本対策）
      - name: リモート最新へ同期
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      # ② PubMed から実在論文を取得 → Gemini で日本語要約
      #    標準ライブラリのみ使用のため pip install は不要
      - name: 論文ニュースを取得・生成
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}      # 任意（未登録なら空でOK）
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}          # 任意（未登録なら空でOK）
          SEARCH_BACKEND: auto
        run: python fetch_news.py

      # ③ push が弾かれたら取り込んで最大3回まで自動リトライ
      - name: コミットして push（競合時は自動リトライ）
        run: |
          git add news.json details.json
          if git diff --staged --quiet; then
            echo "変更なし。終了します。"
            exit 0
          fi
          git commit -m "📰 論文ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "push 成功（試行 ${attempt} 回目）"
              exit 0
            fi
            echo "push 失敗（試行 ${attempt} 回目）→ origin/main を取り込んでリトライ"
            git fetch origin main
            git merge -X ours origin/main --no-edit -m "chore: origin/main を取り込み"
          done
          echo "push に失敗しました"
          exit 1
